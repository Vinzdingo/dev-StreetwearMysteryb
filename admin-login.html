<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>
body{
background:#111;
color:#fff;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e1e1e;
padding:30px;
border-radius:12px;
width:300px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:8px;
border:none;
}

button{
width:100%;
padding:10px;
background:#FFD700;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="box">
<h2>Admin Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<script>
function login(){
let u = document.getElementById("user").value;
let p = document.getElementById("pass").value;

if(u==="admin" && p==="1234"){
localStorage.setItem("admin", "true");
window.location.href="admin.html";
}else{
alert("Forkert login");
}
}
</script>

</body>
</html>
