<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#fff;
}

.header{
padding:20px;
background:#111;
}

.container{
max-width:1100px;
margin:20px auto;
padding:20px;
}

.order{
background:#1a1a1a;
padding:15px;
border-radius:12px;
margin-bottom:10px;
border:1px solid #222;
}

.badge{
padding:4px 8px;
background:orange;
color:#000;
border-radius:6px;
font-size:12px;
}

.small{
font-size:13px;
color:#aaa;
margin-top:5px;
}

button{
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.del{background:#ff3b3b;color:#fff;}

.stats{
display:flex;
gap:10px;
margin:20px 0;
}

.stat{
background:#1a1a1a;
padding:10px 15px;
border-radius:10px;
border:1px solid #222;
}

</style>
</head>

<body>

<div class="header">
<h2>🛒 Admin Dashboard</h2>
</div>

<div class="container">

<div class="stats">
<div class="stat" id="count">Orders: 0</div>
<div class="stat" id="revenue">Revenue: 0 kr</div>
</div>

<div id="orders"></div>

</div>

<script>

function getOrders(){
return JSON.parse(localStorage.getItem("orders")) || [];
}

function saveOrders(o){
localStorage.setItem("orders", JSON.stringify(o));
}

function render(){

let orders = getOrders();
let box = document.getElementById("orders");

box.innerHTML = "";

let revenue = 0;

if(orders.length === 0){
box.innerHTML = "<p>No orders yet</p>";
}

orders.forEach((o,i)=>{

revenue += o.total;

box.innerHTML += `
<div class="order">

<b>${o.id}</b>
<span class="badge">${o.status}</span>

<div class="small">
${o.customer.email}<br>
${o.customer.address} ${o.customer.zip}
</div>

<div class="small">
Items: ${o.items.length} | ${o.total} kr
</div>

<button class="del" onclick="remove(${i})">Delete</button>

</div>
`;
});

document.getElementById("count").innerText = "Orders: " + orders.length;
document.getElementById("revenue").innerText = "Revenue: " + revenue + " kr";
}

function remove(i){
let orders = getOrders();
orders.splice(i,1);
saveOrders(orders);
render();
}

render();

</script>

</body>
</html>
