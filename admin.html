<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#fff;
}

.header{
padding:20px;
background:#111;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1100px;
margin:20px auto;
padding:20px;
}

.order{
background:#1a1a1a;
padding:15px;
border-radius:12px;
margin-bottom:10px;
border:1px solid #222;
}

.row{
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
}

.badge{
padding:4px 8px;
border-radius:6px;
font-size:12px;
background:orange;
color:#000;
}

.small{
font-size:13px;
color:#aaa;
margin-top:5px;
}

.items{
margin-top:10px;
font-size:13px;
color:#ddd;
line-height:1.5;
}

button{
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.del{background:#ff3b3b;color:#fff;}
.ship{background:#00c853;color:#000;}

.stats{
display:flex;
gap:10px;
flex-wrap:wrap;
margin:20px 0;
}

.stat{
background:#1a1a1a;
padding:10px 15px;
border-radius:10px;
border:1px solid #222;
}

</style>
</head>

<body>

<div class="header">
<h2>🛒 Admin Dashboard</h2>
</div>

<div class="container">

<div class="stats">
<div class="stat" id="totalOrders">Orders: 0</div>
<div class="stat" id="revenue">Revenue: 0 kr</div>
</div>

<div id="orders"></div>

</div>

<script>

function getOrders(){
return JSON.parse(localStorage.getItem("orders")) || [];
}

function saveOrders(o){
localStorage.setItem("orders", JSON.stringify(o));
}

function render(){

let orders = getOrders();
let box = document.getElementById("orders");

box.innerHTML = "";

let revenue = 0;

if(orders.length === 0){
box.innerHTML = "<p>No orders yet...</p>";
}

orders.forEach((o,i)=>{

revenue += o.total;

box.innerHTML += `
<div class="order">

<div class="row">
<b>${o.id}</b>
<span class="badge">${o.status || "pending"}</span>
</div>

<div class="small">
📧 ${o.customer?.email || "No email"} <br>
📍 ${o.customer?.address || "No address"} ${o.customer?.zip || ""}
</div>

<div class="items">
${o.items.map(it =>
`• ${it.name} (${it.top}/${it.bottom}) x${it.qty}`
).join("<br>")}
</div>

<div class="small">Total: ${o.total} kr</div>

<button class="ship" onclick="ship(${i})">Mark shipped</button>
<button class="del" onclick="remove(${i})">Delete</button>

</div>
`;
});

document.getElementById("totalOrders").innerText = "Orders: " + orders.length;
document.getElementById("revenue").innerText = "Revenue: " + revenue + " kr";
}

function ship(i){
let orders = getOrders();
orders[i].status = "shipped";
saveOrders(orders);
render();
}

function remove(i){
let orders = getOrders();
orders.splice(i,1);
saveOrders(orders);
render();
}

render();

</script>

</body>
</html>
