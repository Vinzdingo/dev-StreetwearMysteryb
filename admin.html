<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{
font-family:Arial;
background:#111;
color:#fff;
padding:30px;
}

.box{
background:#1e1e1e;
padding:20px;
border-radius:12px;
margin-bottom:15px;
}

button{
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
background:#FFD700;
}
</style>
</head>

<body>

<h1>Admin Panel</h1>

<div id="orders"></div>

<script>

if(localStorage.getItem("admin") !== "true"){
window.location.href="admin-login.html";
}

function getOrders(){
return JSON.parse(localStorage.getItem("orders")) || [];
}

function render(){

let orders = getOrders();
let box = document.getElementById("orders");
box.innerHTML = "";

orders.forEach((o,i)=>{

let div = document.createElement("div");
div.className="box";

div.innerHTML=`
<b>Order #${o.id}</b><br>
Step: ${o.step || "completed"}<br>
Total: ${o.total} kr<br>
Items: ${o.items.length}<br>
<button onclick="remove(${i})">Slet</button>
`;

box.appendChild(div);
});
}

function remove(i){
let orders = getOrders();
orders.splice(i,1);
localStorage.setItem("orders",JSON.stringify(orders));
render();
}

render();

</script>

</body>
</html>
