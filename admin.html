<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f0f0f;
color:#fff;
padding:20px;
}

h1{
margin-bottom:20px;
}

/* BOXES */
.box{
background:#1c1c1c;
padding:15px;
border-radius:12px;
margin-bottom:15px;
border:1px solid #2a2a2a;
}

/* ORDER */
.order{
border-bottom:1px solid #333;
padding:10px 0;
font-size:14px;
}

.small{
color:#aaa;
font-size:12px;
}

/* BUTTON */
button{
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:8px;
}

.delete{
background:#e74c3c;
color:#fff;
}

.sectionTitle{
margin:20px 0 10px;
color:#FFD700;
}
</style>
</head>

<body>

<h1>⚡ Admin Panel</h1>

<div class="sectionTitle">📦 Orders</div>
<div id="orders"></div>

<div class="sectionTitle">📊 Inventory (simple)</div>
<div id="inventory"></div>

<script>

/* GET DATA */
function getOrders(){
return JSON.parse(localStorage.getItem("orders")) || [];
}

function getStock(){
return JSON.parse(localStorage.getItem("stock")) || {
basic:10,
premium:5,
luxury:2
};
}

/* ORDERS */
function renderOrders(){

let orders = getOrders();
let box = document.getElementById("orders");
box.innerHTML = "";

if(orders.length === 0){
box.innerHTML = "<div class='box'>Ingen orders endnu</div>";
return;
}

orders.reverse().forEach((o,i)=>{

let div = document.createElement("div");
div.className = "box";

div.innerHTML = `
<b>Order #${o.id}</b><br>
<div class="small">${o.date}</div><br>

Total: ${o.total} kr<br>
Items: ${o.items.length}<br><br>

${o.items.map(item => `
<div class="order">
${item.name} (${item.top}/${item.bottom}) x${item.qty}
</div>
`).join("")}

<button class="delete" onclick="deleteOrder(${i})">Slet order</button>
`;

box.appendChild(div);

});

}

/* DELETE ORDER */
function deleteOrder(index){

let orders = getOrders();
orders.reverse().splice(index,1);
localStorage.setItem("orders", JSON.stringify(orders.reverse()));
location.reload();

}

/* INVENTORY */
function renderInventory(){

let stock = getStock();
let box = document.getElementById("inventory");

box.innerHTML = "";

for(let key in stock){

let div = document.createElement("div");
div.className = "box";

div.innerHTML = `
<b>${key.toUpperCase()}</b><br><br>
Stock: ${stock[key]} pcs<br>
`;

box.appendChild(div);

}

}

/* INIT */
renderOrders();
renderInventory();

</script>

</body>
</html>
