<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#fff;
}

.header{
padding:20px;
background:#111;
border-bottom:1px solid #222;
}

.container{
max-width:1100px;
margin:20px auto;
padding:20px;
}

.order{
background:#1a1a1a;
padding:15px;
border-radius:12px;
margin-bottom:10px;
border:1px solid #222;
}

.status{
font-size:12px;
padding:4px 8px;
border-radius:6px;
display:inline-block;
background:orange;
color:#000;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

button{
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
}

.del{background:#ff3b3b;color:#fff;}
.ship{background:#00c853;color:#000;}

.total{
margin-top:8px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
<h2>🛒 Admin Dashboard</h2>
</div>

<div class="container" id="orders"></div>

<script>

function getOrders(){
return JSON.parse(localStorage.getItem("orders")) || [];
}

function saveOrders(o){
localStorage.setItem("orders", JSON.stringify(o));
}

function render(){

let orders = getOrders();
let box = document.getElementById("orders");

box.innerHTML = "";

if(orders.length === 0){
box.innerHTML = "<p>No orders yet...</p>";
return;
}

orders.forEach((o,i)=>{

box.innerHTML += `
<div class="order">
<b>Order ${o.id}</b><br>
<span class="status">${o.status}</span>

<div class="total">${o.total} kr</div>

<div class="grid">
<button class="ship" onclick="ship(${i})">Mark shipped</button>
<button class="del" onclick="remove(${i})">Delete</button>
</div>
</div>
`;
});

}

function ship(i){
let orders = getOrders();
orders[i].status = "shipped";
saveOrders(orders);
render();
}

function remove(i){
let orders = getOrders();
orders.splice(i,1);
saveOrders(orders);
render();
}

render();

</script>

</body>
</html>
