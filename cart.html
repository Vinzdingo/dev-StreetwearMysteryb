<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Cart</title>

<style>
body{font-family:Arial;padding:20px;background:#fafafa;}
.item{background:#fff;padding:15px;margin-bottom:10px;border-radius:10px;border:1px solid #eee;}
button{width:100%;padding:10px;background:#000;color:#fff;border:none;border-radius:8px;}
.total{margin-top:20px;font-weight:bold;}
</style>
</head>

<body>

<h1>Kurv</h1>

<div id="cart"></div>
<div class="total" id="total"></div>

<script>

function getCart(){
return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveCart(c){
localStorage.setItem("cart", JSON.stringify(c));
}

function render(){

let cart = getCart();
let box = document.getElementById("cart");
box.innerHTML = "";

let total = 0;

cart.forEach((item,i)=>{

total += item.price * item.qty;

box.innerHTML += `
<div class="item">
<b>${item.name}</b><br>
${item.top} / ${item.bottom}<br>
Qty: ${item.qty}
<button onclick="removeItem(${i})">Fjern</button>
</div>
`;

});

document.getElementById("total").innerText = "Total: " + total + " kr";
}

function removeItem(i){
let cart = getCart();
cart.splice(i,1);
saveCart(cart);
render();
}

render();

</script>

</body>
</html>
