<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Cart</title>

<style>
body {
  font-family:Arial;
  background:#fff;
  color:#111;
  text-align:center;
}

.box {
  max-width:500px;
  margin:50px auto;
  border:1px solid #eee;
  padding:20px;
}

.item {
  border-bottom:1px solid #eee;
  padding:10px;
}

.btn {
  display:inline-block;
  margin-top:15px;
  background:#FFD700;
  padding:12px 20px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}
</style>
</head>

<body>

<h1>Cart</h1>

<div class="box" id="cart"></div>

<script>
const data = {
  basic:{name:"Basic Box", price:299},
  premium:{name:"Premium Box", price:499},
  luxury:{name:"Luxury Box", price:799}
};

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let box = document.getElementById("cart");

if(cart.length === 0){
  box.innerHTML = "Empty cart";
} else {

  let total = 0;
  let html = "";

  cart.forEach(item => {
    total += data[item.id].price;
    html += `<div class="item">${data[item.id].name} - Size: ${item.size}</div>`;
  });

  html += `<h3>Total: ${total} kr</h3>`;
  html += `<a class="btn" href="checkout.html">Checkout</a>`;

  box.innerHTML = html;
}
</script>

</body>
</html>
