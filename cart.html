<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - MysteryStreetwear</title>

<style>
body{
font-family:Arial;
background:#fff;
color:#111;
margin:0;
padding:0;
}

.back{
position:fixed;
top:20px;
left:20px;
font-weight:bold;
cursor:pointer;
}

.container{
max-width:900px;
margin:100px auto;
padding:0 20px;
}

h1{
font-size:40px;
margin-bottom:30px;
}

.item{
display:flex;
gap:20px;
padding:20px;
border:1px solid #eee;
border-radius:12px;
margin-bottom:15px;
align-items:center;
}

.item img{
width:100px;
height:100px;
object-fit:cover;
border-radius:10px;
border:1px solid #eee;
}

.info{
flex:1;
}

.name{
font-size:18px;
font-weight:bold;
margin-bottom:5px;
}

.small{
color:#666;
font-size:14px;
margin-bottom:5px;
}

.price{
font-weight:bold;
}

.remove{
background:#ffeded;
color:#d10000;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
font-size:13px;
}

.total{
margin-top:30px;
font-size:22px;
font-weight:bold;
text-align:right;
}

.checkout{
margin-top:20px;
background:#FFD700;
padding:16px;
text-align:center;
font-weight:bold;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="back" onclick="history.back()">← Tilbage</div>

<div class="container">

<h1>Din kurv</h1>

<div id="cart"></div>

<div class="total" id="total"></div>

<div class="checkout" onclick="checkout()">
Gå til checkout
</div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderCart(){

let container = document.getElementById("cart");
container.innerHTML = "";

let total = 0;

cart.forEach((item, index)=>{

total += item.price;

container.innerHTML += `
<div class="item">
<img src="${item.img}">
<div class="info">
<div class="name">${item.name}</div>
<div class="small">Trøje: ${item.topSize}</div>
<div class="small">Bukser: ${item.bottomSize}</div>
<div class="price">${item.price} kr</div>
</div>
<div class="remove" onclick="removeItem(${index})">Fjern</div>
</div>
`;
});

document.getElementById("total").innerText = "Total: " + total + " kr";
}

function removeItem(index){
cart.splice(index,1);
localStorage.setItem("cart", JSON.stringify(cart));
renderCart();
}

function checkout(){
alert("Checkout kommer i næste step 🔥");
}

renderCart();

</script>

</body>
</html>
