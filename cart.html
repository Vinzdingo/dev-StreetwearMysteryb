<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart</title>

<style>
body{font-family:Arial;padding:20px;background:#fafafa;}

.item{
background:#fff;
padding:15px;
margin-bottom:10px;
border-radius:10px;
border:1px solid #eee;
}

.title{font-weight:bold;}
.small{color:#666;font-size:14px;}

button{
margin-top:10px;
padding:10px;
width:100%;
background:#000;
color:#fff;
border:none;
border-radius:8px;
}

.total{
margin-top:20px;
font-size:18px;
font-weight:bold;
}
</style>
</head>

<body>

<h1>Din kurv</h1>

<div id="cart"></div>

<div class="total" id="total"></div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let box = document.getElementById("cart");

cart.forEach((item,i)=>{

let div=document.createElement("div");
div.className="item";

div.innerHTML=`
<div class="title">${item.name}</div>
<div class="small">Trøje: ${item.top}</div>
<div class="small">Bukse: ${item.bottom}</div>
<button onclick="removeItem(${i})">Fjern</button>
`;

box.appendChild(div);

});

function removeItem(i){
cart.splice(i,1);
localStorage.setItem("cart",JSON.stringify(cart));
location.reload();
}

document.getElementById("total").innerText =
"Total items: " + cart.length;

</script>

</body>
</html>
