<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Cart</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
  text-align:center;
}

.box {
  border:1px solid #eee;
  max-width:400px;
  margin:50px auto;
  padding:20px;
  border-radius:12px;
}

.btn {
  display:inline-block;
  margin-top:15px;
  padding:12px 20px;
  background:#FFD700;
  color:#111;
  font-weight:bold;
  border-radius:8px;
  text-decoration:none;
}
</style>
</head>

<body>

<h1>Kurv</h1>

<div class="box" id="cart">Loading...</div>

<script>
const box = localStorage.getItem("box");
const size = localStorage.getItem("size");

const names = {
  basic:"Basic Box",
  premium:"Premium Box",
  luxury:"Luxury Box"
};

const prices = {
  basic:299,
  premium:499,
  luxury:799
};

const cart = document.getElementById("cart");

if(!box){
  cart.innerHTML = "<p>Kurven er tom</p>";
} else {
  cart.innerHTML = `
    <h3>${names[box]}</h3>
    <p>Størrelse: ${size}</p>
    <p>Pris: ${prices[box]} kr</p>

    <a class="btn" href="checkout.html">Tilbage</a>
  `;
}
</script>

</body>
</html>
