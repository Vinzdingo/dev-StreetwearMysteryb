<script src="products.js"></script>

<script>
  const params = new URLSearchParams(window.location.search);
  const box = params.get("box");

  const container = document.getElementById("cart-content");

  if (!box || !products[box]) {
    container.innerHTML = "<p>Ingen box valgt 🛒</p>";
  } else {
    const item = products[box];

    container.innerHTML = `
      <h2>${item.name}</h2>
      <p>Pris: ${item.price} kr</p>
      <a href="checkout.html"
         style="display:inline-block;margin-top:15px;padding:10px 20px;background:white;color:black;text-decoration:none;border-radius:8px;">
        Gå til checkout
      </a>
    `;
  }
</script>
