<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f6f6f6;
}

/* HEADER */
.header{
background:#fff;
padding:20px;
text-align:center;
border-bottom:1px solid #eee;
}

/* PROGRESS */
.progress{
display:flex;
justify-content:center;
gap:10px;
margin:20px 0;
}

.step{
padding:8px 14px;
border-radius:20px;
background:#eee;
font-size:13px;
}

.step.active{
background:#111;
color:#fff;
}

/* CONTAINER */
.container{
max-width:1000px;
margin:auto;
display:grid;
grid-template-columns:1.5fr 1fr;
gap:20px;
padding:20px;
}

.box{
background:#fff;
padding:20px;
border-radius:14px;
border:1px solid #eee;
}

/* ITEMS */
.item{
border-bottom:1px solid #eee;
padding:12px 0;
}

button{
width:100%;
padding:12px;
background:#111;
color:#fff;
border:none;
border-radius:10px;
margin-top:10px;
cursor:pointer;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:8px;
}

.hidden{display:none;}

</style>

</head>

<body>

<div class="header">
<h1>Checkout</h1>

<div class="progress">
<div class="step active" id="s1">Kurv</div>
<div class="step" id="s2">Adresse</div>
<div class="step" id="s3">Betaling</div>
</div>

</div>

<div class="container">

<!-- LEFT -->
<div class="box" id="left"></div>

<!-- RIGHT -->
<div class="box">

<h3>Summary</h3>
<p id="count"></p>
<p id="total"></p>

<button onclick="nextStep()" id="nextBtn">Videre</button>

</div>

</div>

<script>

let step = 1;

function getCart(){
return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveCart(c){
localStorage.setItem("cart", JSON.stringify(c));
}

/* RENDER STEP */
function render(){

let cart = getCart();

let left = document.getElementById("left");
left.innerHTML = "";

if(step === 1){

left.innerHTML = "<h3>Din kurv</h3>";

cart.forEach((item,i)=>{

left.innerHTML += `
<div class="item">
<b>${item.name}</b><br>
${item.top} / ${item.bottom}<br>
Qty: ${item.qty}
</div>
`;

});

}

if(step === 2){

left.innerHTML = `
<h3>Adresse</h3>
<input placeholder="Navn">
<input placeholder="Adresse">
<input placeholder="Postnummer">
<input placeholder="Email">
`;

}

if(step === 3){

left.innerHTML = `
<h3>Betaling</h3>
<p>Kort betaling (demo)</p>
<input placeholder="Kort nummer">
<input placeholder="MM/YY">
<input placeholder="CVC">
`;
}

updateSummary();
updateSteps();
}

/* SUMMARY */
function updateSummary(){

let cart = getCart();

document.getElementById("count").innerText =
"Items: " + cart.length;

let total = 0;
cart.forEach(i=>total += i.price * i.qty);

document.getElementById("total").innerText =
"Total: " + total + " kr";

}

/* STEPS UI */
function updateSteps(){

document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));

document.getElementById("s"+step).classList.add("active");

document.getElementById("nextBtn").innerText =
step === 3 ? "Betal nu" : "Videre";
}

/* FLOW */
function nextStep(){

if(step < 3){
step++;
render();
return;
}

/* CHECKOUT */
let cart = getCart();

if(cart.length === 0){
alert("Kurven er tom");
return;
}

let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.push({
id: Date.now(),
items: cart,
total: cart.reduce((a,b)=>a + b.price*b.qty,0)
});

localStorage.setItem("orders", JSON.stringify(orders));
localStorage.removeItem("cart");

alert("Order placed!");

window.location.href = "index.html";
}

render();

</script>

</body>
</html>
