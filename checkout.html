<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    .product {
      display: flex;
      gap: 20px;
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      align-items: center;
    }

    .product img {
      width: 320px;
      border-radius: 10px;
    }

    .info h2 {
      margin: 0;
    }

    .price {
      color: #FFD700;
      font-size: 20px;
      margin-top: 5px;
    }

    .section {
      margin-top: 20px;
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      color: #FFD700;
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #333;
      color: #ccc;
    }

    .sizes {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .size-btn {
      padding: 10px 15px;
      background: white;
      color: black;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .size-btn:hover {
      background: #FFD700;
    }

    .selected {
      background: #FFD700 !important;
    }

    .btn {
      display: block;
      margin-top: 20px;
      padding: 14px;
      background: #FFD700;
      color: black;
      text-align: center;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
    }

    h4 {
      margin-top: 20px;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

<div class="container" id="content">Loading...</div>

<script>
const container = document.getElementById("content");

const box = localStorage.getItem("box");

let selectedSize = null;

  const data = {
    basic: {
      name: "Basic Box",
      price: 299,
      img: "https://via.placeholder.com/500x300?text=Basic+Box"
    },
    premium: {
      name: "Premium Box",
      price: 499,
      img: "https://via.placeholder.com/500x300?text=Premium+Box"
    },
    luxury: {
      name: "Luxury Box",
      price: 799,
      img: "https://via.placeholder.com/500x300?text=Luxury+Box"
    }
  };

  const container = document.getElementById("content");

  if (!box || !data[box]) {
    container.innerHTML = "<h2>Ingen box valgt</h2>";
  } else {

    const item = data[box];

    container.innerHTML = `

      <div class="product">
        <img src="${item.img}">
        <div class="info">
          <h2>${item.name}</h2>
          <div class="price">${item.price} kr</div>
          <p>Eksklusiv streetwear mystery box med håndplukkede items.</p>
        </div>
      </div>

      <div class="section">
        <h3>👕 Trøjer (T-shirts / Hoodies)</h3>
        <table>
          <tr>
            <th>Størrelse</th>
            <th>Bryst (cm)</th>
            <th>Længde (cm)</th>
            <th>Fit</th>
          </tr>
          <tr><td>S</td><td>88-94</td><td>66-70</td><td>Tight</td></tr>
          <tr><td>M</td><td>94-100</td><td>70-74</td><td>Normal</td></tr>
          <tr><td>L</td><td>100-108</td><td>74-78</td><td>Loose</td></tr>
          <tr><td>XL</td><td>108-116</td><td>78-82</td><td>Oversized</td></tr>
        </table>

        <h3>👖 Bukser (Cargos / Pants)</h3>
        <table>
          <tr>
            <th>Størrelse</th>
            <th>Talje (cm)</th>
            <th>Benlængde (cm)</th>
            <th>Fit</th>
          </tr>
          <tr><td>S</td><td>72-78</td><td>74-78</td><td>Slank</td></tr>
          <tr><td>M</td><td>78-84</td><td>78-82</td><td>Normal</td></tr>
          <tr><td>L</td><td>84-90</td><td>82-86</td><td>Loose</td></tr>
          <tr><td>XL</td><td>90-98</td><td>86-90</td><td>Baggy</td></tr>
        </table>
      </div>

      <div class="section">
        <h3>Vælg størrelse 👕</h3>

        <div class="sizes">
          <div class="size-btn" onclick="selectSize(this, 'S')">S</div>
          <div class="size-btn" onclick="selectSize(this, 'M')">M</div>
          <div class="size-btn" onclick="selectSize(this, 'L')">L</div>
          <div class="size-btn" onclick="selectSize(this, 'XL')">XL</div>
        </div>
      </div>

      <div class="section">
        <h3>Mulige items 🎁</h3>
        <p>Hoodies • T-shirts • Cargo pants • Jackets • Accessories</p>

        <a class="btn" href="#" onclick="buy()">Betal nu (demo)</a>
      </div>

    `;
  }

  window.buy = function() {
  if (!selectedSize) {
    alert("Vælg en størrelse først!");
    return;
  }

  // gem data
  localStorage.setItem("box", box);
  localStorage.setItem("size", selectedSize);

  // send til cart
  window.location.href = "cart.html";
};
