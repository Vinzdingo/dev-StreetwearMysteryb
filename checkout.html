<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Checkout</title>

<style>
body{font-family:Arial;background:#f6f6f6;}
.container{max-width:900px;margin:40px auto;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;}
.box{background:#fff;padding:20px;border-radius:14px;}
button{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:10px;}
.item{border-bottom:1px solid #eee;padding:10px 0;}
</style>
</head>

<body>

<h1>Checkout</h1>

<div class="container">
<div class="box" id="cartBox"></div>

<div class="box">
<h3>Summary</h3>
<p id="total"></p>
<button onclick="checkout()">Betal</button>
</div>
</div>

<script>

function getCart(){
return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveOrders(o){
localStorage.setItem("orders", JSON.stringify(o));
}

function render(){

let cart = getCart();
let box = document.getElementById("cartBox");
box.innerHTML = "";

let total = 0;

cart.forEach(i=>{
total += i.price * i.qty;

box.innerHTML += `
<div class="item">
<b>${i.name}</b><br>
${i.top} / ${i.bottom}
</div>`;
});

document.getElementById("total").innerText = "Total: " + total + " kr";
}

function checkout(){

let cart = getCart();

let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.push({
id: Date.now(),
items: cart,
total: cart.reduce((a,b)=>a+b.price*b.qty,0)
});

localStorage.setItem("orders", JSON.stringify(orders));
localStorage.removeItem("cart");

alert("Order placed");
location.reload();
}

render();

</script>

</body>
</html>
