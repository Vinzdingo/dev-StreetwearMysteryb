<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
.header{background:#111;color:#fff;padding:20px;text-align:center;}

.container{
max-width:1000px;margin:30px auto;
display:grid;grid-template-columns:2fr 1fr;gap:20px;padding:20px;
}

.box{
background:#fff;padding:20px;border-radius:12px;
}

.item{
border-bottom:1px solid #eee;padding:10px 0;
}

button{
width:100%;padding:14px;background:#111;color:#fff;
border:none;border-radius:10px;cursor:pointer;
margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
<h2>Secure Checkout</h2>
</div>

<div class="container">

<div class="box" id="cartBox"></div>

<div class="box">
<h3>Order Summary</h3>
<p id="count"></p>
<p id="total"></p>
<button onclick="checkout()">PAY NOW</button>
</div>

</div>

<script>

function getCart(){
return JSON.parse(localStorage.getItem("cart")) || [];
}

function getOrders(){
return JSON.parse(localStorage.getItem("orders")) || [];
}

function saveOrders(o){
let orders = getOrders();
orders.push(o);
localStorage.setItem("orders", JSON.stringify(orders));
}

function render(){

let cart = getCart();
let box = document.getElementById("cartBox");
box.innerHTML = "";

let total = 0;

cart.forEach(item=>{
total += item.price * item.qty;

box.innerHTML += `
<div class="item">
<b>${item.name}</b><br>
${item.top} / ${item.bottom}<br>
Qty: ${item.qty}<br>
${item.price * item.qty} kr
</div>
`;
});

document.getElementById("count").innerText = "Items: " + cart.length;
document.getElementById("total").innerText = "Total: " + total + " kr";
}

function checkout(){

let cart = getCart();

if(cart.length === 0){
alert("Cart is empty");
return;
}

let order = {
id: "MS-" + Date.now(),
items: cart,
total: cart.reduce((a,b)=>a+(b.price*b.qty),0),
status: "pending",
date: new Date().toISOString()
};

saveOrders(order);

localStorage.removeItem("cart");

alert("Order placed ✔");

window.location.href = "admin.html";
}

render();

</script>

</body>
</html>
