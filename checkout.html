<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
body{font-family:Arial;background:#f6f6f6;margin:0;}

.header{
background:#111;color:#fff;padding:20px;text-align:center;
}

.container{
max-width:900px;margin:30px auto;padding:20px;
}

.box{
background:#fff;padding:20px;border-radius:12px;
margin-bottom:15px;
}

.item{
border-bottom:1px solid #eee;
padding:10px 0;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:8px;
}

button{
width:100%;
padding:14px;
background:#111;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
<h2>Secure Checkout</h2>
</div>

<div class="container">

<div class="box" id="cartBox"></div>

<div class="box">
<h3>Customer info</h3>

<input id="email" placeholder="Email">
<input id="address" placeholder="Adresse">
<input id="zip" placeholder="Postnummer">

<button onclick="placeOrder()">PLACE ORDER</button>
</div>

</div>

<script>

function getCart(){
return JSON.parse(localStorage.getItem("cart")) || [];
}

function getOrders(){
return JSON.parse(localStorage.getItem("orders")) || [];
}

function saveOrders(orders){
localStorage.setItem("orders", JSON.stringify(orders));
}

function render(){

let cart = getCart();
let box = document.getElementById("cartBox");
box.innerHTML = "";

let total = 0;

cart.forEach(item=>{
total += item.price * item.qty;

box.innerHTML += `
<div class="item">
<b>${item.name}</b><br>
${item.top} / ${item.bottom}<br>
Qty: ${item.qty}
</div>
`;
});

box.innerHTML += `<h3>Total: ${total} kr</h3>`;
}

function placeOrder(){

let cart = getCart();

if(cart.length === 0){
alert("Cart er tom");
return;
}

let orders = getOrders();

let order = {
id: "MS-" + Date.now(),
items: cart,
total: cart.reduce((a,b)=>a + (b.price*b.qty),0),
status: "pending",
customer:{
email: document.getElementById("email").value,
address: document.getElementById("address").value,
zip: document.getElementById("zip").value
},
date: new Date().toISOString()
};

orders.push(order);

saveOrders(orders);

localStorage.removeItem("cart");

alert("Order created ✔");

window.location.href = "admin.html";
}

render();

</script>

</body>
</html>
