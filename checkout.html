<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Checkout</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
  text-align:center;
}

.container {
  max-width:500px;
  margin:auto;
  padding:40px;
}

input {
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #eee;
  border-radius:8px;
}

.btn {
  display:block;
  padding:12px;
  background:#FFD700;
  color:#111;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>Checkout</h1>

<input placeholder="Card number">
<input placeholder="MM/YY">
<input placeholder="CVC">

<div class="btn" onclick="pay()">Pay now</div>

</div>

<script>
function pay(){
  localStorage.removeItem("cart");
  alert("Payment successful");
  window.location.href = "index.html";
}
</script>

</body>
</html>
