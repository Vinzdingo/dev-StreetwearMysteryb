<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 30px;
    }

    .card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .sizes span {
      display: inline-block;
      background: white;
      color: black;
      padding: 6px 10px;
      margin: 5px;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      display: block;
      text-align: center;
      padding: 12px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      margin-top: 15px;
    }

    h2 {
      margin-top: 0;
    }

    ul {
      padding-left: 20px;
      color: #ccc;
    }

    p {
      color: #ccc;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container" id="checkout">
    <p>Loader...</p>
  </div>

  <script src="products.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const box = params.get("box");

    const images = {
      basic: "https://via.placeholder.com/600x300?text=Basic+Box",
      premium: "https://via.placeholder.com/600x300?text=Premium+Box",
      luxury: "https://via.placeholder.com/600x300?text=Luxury+Box"
    };

    const data = {
      basic: {
        name: "Basic Box",
        price: 299,
        desc: "Perfekt starter box med streetwear essentials til hverdagen."
      },
      premium: {
        name: "Premium Box",
        price: 499,
        desc: "Bedre kvalitet og mere eksklusive streetwear items."
      },
      luxury: {
        name: "Luxury Box",
        price: 799,
        desc: "Top tier mystery box med limited edition streetwear."
      }
    };

    const container = document.getElementById("checkout");

    if (!box || !data[box]) {
      container.innerHTML = "<p>Ingen box valgt</p>";
    } else {

      const item = data[box];

      container.innerHTML = `
        <div class="card">
          <img src="${images[box]}" />
          <h2>${item.name}</h2>
          <h3>${item.price} kr</h3>
          <p>${item.desc}</p>
        </div>

        <div class="card">
          <h2>Størrelsesguide 📏</h2>
          <p>
            Vores items har normal til oversized fit.<br><br>
            S = small fit<br>
            M = normal fit<br>
            L = loose fit<br>
            XL = oversized fit
          </p>
        </div>

        <div class="card">
          <h2>Tilgængelige størrelser 👕</h2>
          <div class="sizes">
            <span>S</span>
            <span>M</span>
            <span>L</span>
            <span>XL</span>
          </div>
        </div>

        <div class="card">
          <h2>Mulige items 🎁</h2>
          <ul>
            <li>Hoodies</li>
            <li>T-shirts</li>
            <li>Cargo pants</li>
            <li>Jackets</li>
            <li>Accessories</li>
          </ul>

          <a class="btn" href="#">Køb nu (demo)</a>
        </div>
      `;
    }
  </script>

</body>
</html>
