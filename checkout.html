<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Checkout</title>

<style>
body{font-family:Arial;background:#f6f6f6;padding:20px;}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
}

.step{
display:none;
}

.step.active{
display:block;
}

.bar{
display:flex;
gap:10px;
margin-bottom:20px;
}

.dot{
flex:1;
height:6px;
background:#ddd;
border-radius:10px;
}

.dot.active{
background:#111;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#111;
color:#fff;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="bar">
<div class="dot active" id="d1"></div>
<div class="dot" id="d2"></div>
<div class="dot" id="d3"></div>
</div>

<!-- STEP 1 -->
<div class="step active" id="step1">
<h2>Kurv</h2>
<div id="cart"></div>
<button onclick="next(2)">Gå til levering</button>
</div>

<!-- STEP 2 -->
<div class="step" id="step2">
<h2>Levering</h2>

<input placeholder="Navn">
<input placeholder="Adresse">
<input placeholder="Postnr">

<button onclick="next(3)">Gå til betaling</button>
</div>

<!-- STEP 3 -->
<div class="step" id="step3">
<h2>Bekræft ordre</h2>

<p id="total"></p>

<button onclick="placeOrder()">Betal nu</button>
</div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderCart(){

let box = document.getElementById("cart");
box.innerHTML="";

let total=0;

cart.forEach(i=>{
total += i.price * i.qty;

box.innerHTML += `
<p>${i.name} (${i.top}/${i.bottom}) - ${i.qty}</p>
`;
});

document.getElementById("total").innerText="Total: "+total+" kr";
}

function next(step){

document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
document.getElementById("step"+step).classList.add("active");

document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
document.getElementById("d"+step).classList.add("active");

renderCart();
}

function placeOrder(){

let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.push({
id:Date.now(),
items:cart,
total:cart.reduce((a,b)=>a+b.price*b.qty,0),
step:"completed"
});

localStorage.setItem("orders",JSON.stringify(orders));
localStorage.removeItem("cart");

alert("Order placed!");
window.location.href="index.html";
}

renderCart();

</script>

</body>
</html>
