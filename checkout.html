<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
body{font-family:Arial;background:#f7f7f7;padding:30px;}

.container{
max-width:900px;
margin:auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.box{
background:#fff;
padding:20px;
border-radius:12px;
}

.item{
border-bottom:1px solid #eee;
padding:10px 0;
}

button{
width:100%;
padding:12px;
background:#111;
color:#fff;
border:none;
margin-top:10px;
}

</style>
</head>

<body>

<h1>Checkout</h1>

<div class="container">

<div class="box" id="cartBox"></div>

<div class="box">
<h3>Summary</h3>
<p id="count"></p>
<p id="total"></p>
<button onclick="checkout()">Betal</button>
</div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function render(){

let box=document.getElementById("cartBox");
box.innerHTML="";

cart.forEach((item,i)=>{

let div=document.createElement("div");
div.className="item";

div.innerHTML=`
<b>${item.name}</b><br>
${item.top} / ${item.bottom}<br>
<button onclick="remove(${i})">Fjern</button>
`;

box.appendChild(div);

});

document.getElementById("count").innerText="Items: "+cart.length;

let total=0;
cart.forEach(i=>total+=i.price||299);

document.getElementById("total").innerText="Total: "+total+" kr";
}

function remove(i){
cart.splice(i,1);
localStorage.setItem("cart",JSON.stringify(cart));
render();
}

function checkout(){
alert("Order placed (demo)");
localStorage.removeItem("cart");
location.reload();
}

render();

</script>

</body>
</html>
