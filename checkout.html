<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 30px;
    }

    .card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #FFD700;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
    }

    ul {
      color: #ccc;
    }

    .sizes span {
      display: inline-block;
      background: white;
      color: black;
      padding: 5px 10px;
      margin: 4px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div id="content">Loader checkout...</div>
  </div>

  <script src="products.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const params = new URLSearchParams(window.location.search);
      const box = params.get("box");

      const content = document.getElementById("content");

      const images = {
        basic: "https://via.placeholder.com/600x300?text=Basic+Box",
        premium: "https://via.placeholder.com/600x300?text=Premium+Box",
        luxury: "https://via.placeholder.com/600x300?text=Luxury+Box"
      };

      const data = {
        basic: {
          name: "Basic Box",
          price: 299,
          desc: "Starter streetwear box med essentials."
        },
        premium: {
          name: "Premium Box",
          price: 499,
          desc: "Mere eksklusive items og bedre kvalitet."
        },
        luxury: {
          name: "Luxury Box",
          price: 799,
          desc: "Top tier streetwear mystery box."
        }
      };

      if (!box || !data[box]) {
        content.innerHTML = "<div class='card'><h2>Ingen box valgt</h2></div>";
        return;
      }

      const item = data[box];

      content.innerHTML = `
        <div class="card">
          <img src="${images[box]}" />
          <h2>${item.name}</h2>
          <h3>${item.price} kr</h3>
          <p>${item.desc}</p>
        </div>

        <div class="card">
          <h2>Størrelsesguide 📏</h2>
          <p>S = tight fit<br>M = normal fit<br>L = loose fit<br>XL = oversized</p>
        </div>

        <div class="card">
          <h2>Størrelser 👕</h2>
          <div class="sizes">
            <span>S</span>
            <span>M</span>
            <span>L</span>
            <span>XL</span>
          </div>
        </div>

        <div class="card">
          <h2>Indeholder 🎁</h2>
          <ul>
            <li>Hoodies</li>
            <li>T-shirts</li>
            <li>Cargo pants</li>
            <li>Jackets</li>
          </ul>

          <a class="btn" href="#">Betal nu (demo)</a>
        </div>
      `;
    });
  </script>

</body>
</html>
