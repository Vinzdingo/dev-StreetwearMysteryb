<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
body{font-family:Arial;background:#f6f6f6;margin:0;}

.header{
background:#111;color:#fff;padding:20px;text-align:center;
}

.container{
max-width:900px;margin:30px auto;padding:20px;
}

.box{
background:#fff;padding:20px;border-radius:12px;
margin-bottom:15px;
}

.step{
display:none;
}

.step.active{
display:block;
}

.item{
border-bottom:1px solid #eee;padding:10px 0;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:8px;
}

button{
width:100%;
padding:14px;
background:#111;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

.nav{
display:flex;
justify-content:space-between;
gap:10px;
}

.small{
font-size:12px;color:#666;
}

</style>
</head>

<body>

<div class="header">
<h2>Secure Checkout</h2>
</div>

<div class="container">

<!-- STEP 1 -->
<div class="box step active" id="step1">
<h3>1. Din kurv</h3>
<div id="cartBox"></div>
<p id="total"></p>

<button onclick="nextStep(2)">Fortsæt</button>
</div>

<!-- STEP 2 -->
<div class="box step" id="step2">
<h3>2. Kunde info</h3>

<input id="email" placeholder="Email">
<input id="address" placeholder="Adresse">
<input id="zip" placeholder="Postnummer">

<div class="nav">
<button onclick="nextStep(1)">Tilbage</button>
<button onclick="nextStep(3)">Fortsæt</button>
</div>
</div>

<!-- STEP 3 -->
<div class="box step" id="step3">
<h3>3. Bekræft ordre</h3>

<p class="small">Klik nedenfor for at placere din ordre</p>

<button onclick="placeOrder()">PLACE ORDER</button>
</div>

</div>

<script>

function getCart(){
return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveOrders(o){
let orders = JSON.parse(localStorage.getItem("orders")) || [];
orders.push(o);
localStorage.setItem("orders", JSON.stringify(orders));
}

let currentStep = 1;

function renderCart(){

let cart = getCart();
let box = document.getElementById("cartBox");
box.innerHTML = "";

let total = 0;

cart.forEach(item=>{
total += item.price * item.qty;

box.innerHTML += `
<div class="item">
<b>${item.name}</b><br>
${item.top} / ${item.bottom}<br>
Qty: ${item.qty}
</div>
`;
});

document.getElementById("total").innerText = "Total: " + total + " kr";
}

function nextStep(step){

if(step === 3 && getCart().length === 0){
alert("Kurven er tom");
return;
}

document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
document.getElementById("step"+step).classList.add("active");

currentStep = step;

if(step === 1) renderCart();
}

function placeOrder(){

let cart = getCart();

let order = {
id: "MS-" + Date.now(),
items: cart,
total: cart.reduce((a,b)=>a+(b.price*b.qty),0),
status: "pending",
customer: {
email: document.getElementById("email").value,
address: document.getElementById("address").value,
zip: document.getElementById("zip").value
},
date: new Date().toISOString()
};

saveOrders(order);

localStorage.removeItem("cart");

alert("Order placed ✔");

window.location.href = "index.html";
}

renderCart();

</script>

</body>
</html>
