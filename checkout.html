<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f0f0f;
  color:white;
}

.container {
  max-width:900px;
  margin:auto;
  padding:30px;
}

.product {
  display:flex;
  gap:20px;
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
}

.product img {
  width:300px;
  border-radius:10px;
}

.section {
  margin-top:20px;
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
}

table {
  width:100%;
  border-collapse: collapse;
  margin-top:10px;
}

th, td {
  border-bottom:1px solid #333;
  padding:8px;
  color:#ccc;
  text-align:left;
}

th {
  color:#FFD700;
}

.sizes {
  display:flex;
  gap:10px;
}

.size-btn {
  background:white;
  color:black;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.selected {
  background:#FFD700 !important;
}

.btn {
  display:block;
  margin-top:20px;
  padding:12px;
  background:#FFD700;
  color:black;
  text-align:center;
  font-weight:bold;
  border-radius:8px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container" id="app">Loading...</div>

<script>
const box = localStorage.getItem("box");
let selectedSize = null;

const data = {
  basic: { name:"Basic Box", price:299, img:"https://via.placeholder.com/400x250" },
  premium: { name:"Premium Box", price:499, img:"https://via.placeholder.com/400x250" },
  luxury: { name:"Luxury Box", price:799, img:"https://via.placeholder.com/400x250" }
};

const app = document.getElementById("app");

if (!box || !data[box]) {
  app.innerHTML = "<h2>Ingen box valgt</h2>";
} else {

  const item = data[box];

  app.innerHTML = `
    <div class="product">
      <img src="${item.img}">
      <div>
        <h2>${item.name}</h2>
        <h3 style="color:#FFD700">${item.price} kr</h3>
      </div>
    </div>

    <div class="section">
      <h3>👕 Trøjer</h3>
      <table>
        <tr><th>Str</th><th>Bryst</th><th>Længde</th></tr>
        <tr><td>S</td><td>88-94</td><td>66-70</td></tr>
        <tr><td>M</td><td>94-100</td><td>70-74</td></tr>
        <tr><td>L</td><td>100-108</td><td>74-78</td></tr>
        <tr><td>XL</td><td>108-116</td><td>78-82</td></tr>
      </table>

      <h3 style="margin-top:20px">👖 Bukser</h3>
      <table>
        <tr><th>Str</th><th>Talje</th><th>Længde</th></tr>
        <tr><td>S</td><td>72-78</td><td>74-78</td></tr>
        <tr><td>M</td><td>78-84</td><td>78-82</td></tr>
        <tr><td>L</td><td>84-90</td><td>82-86</td></tr>
        <tr><td>XL</td><td>90-98</td><td>86-90</td></tr>
      </table>
    </div>

    <div class="section">
      <h3>Vælg størrelse</h3>
      <div class="sizes">
        <div class="size-btn" onclick="pick(this,'S')">S</div>
        <div class="size-btn" onclick="pick(this,'M')">M</div>
        <div class="size-btn" onclick="pick(this,'L')">L</div>
        <div class="size-btn" onclick="pick(this,'XL')">XL</div>
      </div>

      <a class="btn" href="#" onclick="goCart()">Gå til kurv</a>
    </div>
  `;
}

window.pick = function(el,size){
  selectedSize = size;
  document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
};

window.goCart = function(){
  if(!selectedSize){
    alert("Vælg størrelse");
    return;
  }

  localStorage.setItem("size", selectedSize);
  window.location.href = "cart.html";
};
</script>

</body>
</html>
