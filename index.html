<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MysteryStreetwear</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#fff;
color:#111;
overflow-x:hidden;
}

/* NAVBAR */
.navbar{
height:80px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
border-bottom:1px solid #eee;
position:fixed;
top:0;
width:100%;
background:#fff;
z-index:1000;
}

.logo{
font-size:22px;
font-weight:700;
letter-spacing:0.5px;
}

.nav-right{
display:flex;
align-items:center;
gap:18px;
}

/* CART ICON */
.cart{
position:relative;
font-size:22px;
cursor:pointer;
user-select:none;
}

.cart span{
position:absolute;
top:-8px;
right:-10px;
background:#FFD700;
color:#000;
font-size:11px;
width:18px;
height:18px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
}

/* MENU */
.menu-btn{
font-size:28px;
cursor:pointer;
user-select:none;
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
right:-320px;
width:300px;
height:100%;
background:#fff;
box-shadow:-10px 0 30px rgba(0,0,0,0.08);
transition:.3s ease;
padding-top:100px;
z-index:2000;
}

.sidebar.active{
right:0;
}

.sidebar a{
display:block;
padding:18px 22px;
text-decoration:none;
color:#111;
border-bottom:1px solid #eee;
font-size:15px;
}

.sidebar a:hover{
background:#FFD700;
}

/* HERO */
.hero{
margin-top:80px;
height:70vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.95)),
url('https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
}

.hero h1{
font-size:60px;
letter-spacing:2px;
}

.hero p{
margin-top:12px;
color:#666;
font-size:16px;
}

/* STEPS */
.steps{
max-width:1100px;
margin:90px auto;
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
padding:0 20px;
}

.step{
width:300px;
padding:28px;
border:1px solid #eee;
border-radius:14px;
text-align:center;
transition:.2s ease;
background:#fff;
}

.step:hover{
transform:translateY(-6px);
box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.step span{
font-size:42px;
font-weight:800;
color:#FFD700;
display:block;
margin-bottom:10px;
}

.step h3{
font-size:18px;
margin-bottom:8px;
}

.step p{
font-size:14px;
color:#666;
line-height:1.5;
}

/* MINI CART */
.minicart{
position:fixed;
top:80px;
right:20px;
width:280px;
background:#fff;
border:1px solid #eee;
border-radius:12px;
padding:14px;
display:none;
z-index:9999;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.minicart.active{
display:block;
}

.minicart h4{
margin-bottom:10px;
font-size:15px;
}

.minicart-item{
font-size:13px;
color:#555;
margin-bottom:6px;
}

.minicart button{
margin-top:10px;
width:100%;
padding:10px;
background:#111;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

<div class="logo">MysteryStreetwear</div>

<div class="nav-right">

<!-- CART -->
<div class="cart" onclick="toggleCart()">
🛒
<span id="cartCount">0</span>
</div>

<!-- MENU -->
<div class="menu-btn" onclick="toggleMenu()">☰</div>

</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
<a href="product.html?id=basic">Basic Box</a>
<a href="product.html?id=premium">Premium Box</a>
<a href="product.html?id=luxury">Luxury Box</a>
<a href="cart.html">Kurv</a>
</div>

<!-- HERO -->
<section class="hero">
<div>
<h1>MYSTERY STREETWEAR</h1>
<p>Premium streetwear mystery boxes</p>
</div>
</section>

<!-- FLOW 1-2-3 -->
<section class="steps">

<div class="step">
<span>1</span>
<h3>Vælg box</h3>
<p>Åbn menuen og vælg din box</p>
</div>

<div class="step">
<span>2</span>
<h3>Vi pakker</h3>
<p>Vi sammensætter din mystery box</p>
</div>

<div class="step">
<span>3</span>
<h3>Unbox</h3>
<p>Modtag og oplev din surprise</p>
</div>

</section>

<!-- MINI CART -->
<div class="minicart" id="minicart">
<h4>Din kurv</h4>
<div id="miniItems"></div>
<button onclick="goCart()">Gå til kurv</button>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

/* MENU */
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active");
}

/* CART TOGGLE */
function toggleCart(){
document.getElementById("minicart").classList.toggle("active");
updateCart();
}

/* GO CART */
function goCart(){
window.location.href="cart.html";
}

/* UPDATE CART */
function updateCart(){

document.getElementById("cartCount").innerText = cart.length;

let list = document.getElementById("miniItems");
list.innerHTML = "";

cart.slice(-5).forEach(item=>{
let div = document.createElement("div");
div.className="minicart-item";

div.innerText = typeof item === "string"
? item
: `${item.name} (${item.top || "-"} / ${item.bottom || "-"})`;

list.appendChild(div);
});

}

/* CLOSE OUTSIDE */
document.addEventListener("click", function(e){

let box = document.getElementById("minicart");
let cartIcon = document.querySelector(".cart");
let menuBtn = document.querySelector(".menu-btn");
let sidebar = document.getElementById("sidebar");

if(box && !box.contains(e.target) && !cartIcon.contains(e.target)){
box.classList.remove("active");
}

if(sidebar && !sidebar.contains(e.target) && !menuBtn.contains(e.target)){
sidebar.classList.remove("active");
}

});

/* INIT */
updateCart();

</script>

</body>
</html>
