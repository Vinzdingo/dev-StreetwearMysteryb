<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MysteryStreetwear</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:#fff;color:#111;overflow-x:hidden;}

/* NAV */
.navbar{
height:80px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
border-bottom:1px solid #eee;
position:fixed;
top:0;
width:100%;
background:#fff;
z-index:1000;
}

.logo{font-size:22px;font-weight:bold;}

.nav-right{display:flex;align-items:center;gap:15px;}

.cart{
position:relative;
cursor:pointer;
font-size:22px;
}

.cart span{
position:absolute;
top:-8px;
right:-10px;
background:#FFD700;
width:18px;height:18px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
}

/* MENU */
.menu-btn{font-size:28px;cursor:pointer;}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
right:-320px;
width:300px;
height:100%;
background:#fff;
box-shadow:-10px 0 30px rgba(0,0,0,0.08);
transition:.3s;
padding-top:100px;
z-index:2000;
}

.sidebar.active{right:0;}

.sidebar a{
display:block;
padding:18px;
text-decoration:none;
color:#111;
border-bottom:1px solid #eee;
}

.sidebar a:hover{background:#FFD700;}

/* HERO */
.hero{
margin-top:80px;
height:65vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.95)),
url('https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
}

.hero h1{font-size:58px;}
.hero p{color:#666;margin-top:10px;}

/* STEPS */
.steps{
max-width:1000px;
margin:80px auto;
display:flex;
gap:25px;
justify-content:center;
flex-wrap:wrap;
padding:0 20px;
}

.step{
width:300px;
border:1px solid #eee;
padding:25px;
border-radius:12px;
text-align:center;
}

.step span{
font-size:40px;
color:#FFD700;
font-weight:bold;
}

</style>
</head>

<body>

<div class="navbar">

<div class="logo">MysteryStreetwear</div>

<div class="nav-right">

<div class="cart" onclick="goCart()">
🛒 <span id="cartCount">0</span>
</div>

<div class="menu-btn" onclick="toggleMenu()">☰</div>

</div>

</div>

<div class="sidebar" id="sidebar">
<a href="product.html?id=basic">Basic Box</a>
<a href="product.html?id=premium">Premium Box</a>
<a href="product.html?id=luxury">Luxury Box</a>
<a href="cart.html">Kurv</a>
</div>

<div class="hero">
<div>
<h1>MYSTERY STREETWEAR</h1>
<p>Premium mystery boxes</p>
</div>
</div>

<div class="steps">
<div class="step"><span>1</span><h3>Vælg box</h3></div>
<div class="step"><span>2</span><h3>Vi pakker</h3></div>
<div class="step"><span>3</span><h3>Unbox</h3></div>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

document.getElementById("cartCount").innerText = cart.length;

function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active");
}

function goCart(){
window.location.href="cart.html";
}

</script>

</body>
</html>
