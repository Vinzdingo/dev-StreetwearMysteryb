<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">

  <title>Streetwear Mystery Box</title>

  <style>
    body {

      font-family: Arial, sans-serif;
      background: #0f0f0f;

    }

    header {
      padding: 80px 20px;
      background: black;
    }

    h1 {
      font-size: 42px;
      margin: 0;
    }

    p {
      color: #aaa;
      font-size: 18px;

    <div class="box">
