<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Shop</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#fff;
  color:#111;
}

h1 {
  text-align:center;
  margin-top:40px;
}

.container {
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:40px;
  flex-wrap:wrap;
}

.box {
  background:#fff;
  border:2px solid #eee;
  padding:20px;
  width:220px;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
  text-align:center;
}

.box:hover {
  transform:translateY(-5px);
  border-color:#FFD700;
  box-shadow:0 10px 20px rgba(0,0,0,0.08);
}

.price {
  color:#111;
  margin-top:10px;
}

.btn {
  display:inline-block;
  margin-top:10px;
  padding:10px 15px;
  background:#FFD700;
  color:#111;
  font-weight:bold;
  border-radius:8px;
}
</style>
</head>

<body>

<h1>Vælg din Mystery Box</h1>

<div class="container">

  <div class="box" onclick="selectBox('basic')">
    <h3>Basic Box</h3>
    <p class="price">299 kr</p>
    <div class="btn">Vælg</div>
  </div>

  <div class="box" onclick="selectBox('premium')">
    <h3>Premium Box</h3>
    <p class="price">499 kr</p>
    <div class="btn">Vælg</div>
  </div>

  <div class="box" onclick="selectBox('luxury')">
    <h3>Luxury Box</h3>
    <p class="price">799 kr</p>
    <div class="btn">Vælg</div>
  </div>

</div>

<script>
function selectBox(type){
  localStorage.setItem("box", type);
  window.location.href = "checkout.html";
}
</script>

</body>
</html>
