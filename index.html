<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>MysteryStreetwear</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
}

/* TOP BAR */
.nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 30px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:white;
  z-index:10;
}

.logo {
  font-weight:bold;
  font-size:18px;
}

/* MENU RIGHT */
.menu {
  position:relative;
}

.menu-btn {
  cursor:pointer;
  font-weight:bold;
}

/* DROPDOWN / SIDEMENU */
.dropdown {
  position:absolute;
  right:0;
  top:40px;
  width:260px;
  background:white;
  border:1px solid #eee;
  border-radius:12px;
  overflow:hidden;
  display:none;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.menu:hover .dropdown {
  display:block;
  animation:fade 0.2s ease;
}

@keyframes fade {
  from {opacity:0; transform:translateY(-5px);}
  to {opacity:1; transform:translateY(0);}
}

.item {
  padding:12px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  transition:0.2s;
}

.item:hover {
  background:#FFD700;
}

/* HERO */
.hero {
  padding:60px 20px;
  text-align:center;
}

.hero h1 {
  font-size:42px;
}

/* CONTENT */
.content {
  display:flex;
  justify-content:center;
  padding:30px;
  gap:20px;
  flex-wrap:wrap;
}

/* PRODUCT PREVIEW */
.card {
  width:260px;
  border:1px solid #eee;
  border-radius:12px;
  overflow:hidden;
  transition:0.25s;
}

.card:hover {
  transform:translateY(-5px);
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.card img {
  width:100%;
  height:170px;
  object-fit:cover;
}

.info {
  padding:12px;
}

.btn {
  display:block;
  margin-top:10px;
  padding:10px;
  background:#FFD700;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="nav">
  <div class="logo">MysteryStreetwear</div>

  <div class="menu">
    <div class="menu-btn">Browse Boxes ▾</div>

    <div class="dropdown">
      <div class="item" onclick="go('basic')">Basic Box - 299 kr</div>
      <div class="item" onclick="go('premium')">Premium Box - 499 kr</div>
      <div class="item" onclick="go('luxury')">Luxury Box - 799 kr</div>
    </div>
  </div>
</div>

<div class="hero">
  <h1>Streetwear Mystery Boxes</h1>
  <p>Klik eller hover for at udforske</p>
</div>

<div class="content">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
    <div class="info">
      <h3>Basic Box</h3>
      <p>3 items - streetwear essentials</p>
      <div class="btn" onclick="go('basic')">View</div>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1520975682031-a6c3b3f4f5d8">
    <div class="info">
      <h3>Premium Box</h3>
      <p>5 items - upgraded streetwear</p>
      <div class="btn" onclick="go('premium')">View</div>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1520975869018-5a6a0d2b5d1c">
    <div class="info">
      <h3>Luxury Box</h3>
      <p>7 items - premium drops</p>
      <div class="btn" onclick="go('luxury')">View</div>
    </div>
  </div>

</div>

<script>
function go(id){
  window.location.href = "product.html?id=" + id;
}
</script>

</body>
</html>
