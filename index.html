<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MysteryStreetwear</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:#fff;color:#111;overflow-x:hidden;}

/* NAV */
.navbar{
height:80px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
border-bottom:1px solid #eee;
position:fixed;
top:0;
width:100%;
background:#fff;
z-index:1000;
}

.logo{font-size:22px;font-weight:bold;}

.nav-right{display:flex;gap:15px;align-items:center;}

.cart{
position:relative;
font-size:22px;
cursor:pointer;
}

.cart span{
position:absolute;
top:-8px;
right:-10px;
background:#FFD700;
width:18px;height:18px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
}

/* MENU */
.menu{font-size:28px;cursor:pointer;}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
right:-320px;
width:300px;
height:100%;
background:#fff;
box-shadow:-10px 0 30px rgba(0,0,0,0.08);
transition:.3s;
padding-top:100px;
}

.sidebar.active{right:0;}

.sidebar a{
display:block;
padding:18px;
text-decoration:none;
color:#111;
border-bottom:1px solid #eee;
}

.sidebar a:hover{background:#FFD700;}

/* HERO */
.hero{
margin-top:80px;
height:70vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.95)),
url('https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
}

.hero h1{font-size:58px;}

/* STEPS */
.steps{
max-width:1000px;
margin:80px auto;
display:flex;
gap:25px;
flex-wrap:wrap;
justify-content:center;
}

.step{
width:300px;
border:1px solid #eee;
padding:25px;
border-radius:12px;
text-align:center;
}

.step span{
font-size:40px;
color:#FFD700;
font-weight:bold;
}

/* 🧺 MINI CART (ZALANDO STYLE FIXED) */
.minicart{
position:fixed;
top:80px;
right:20px;
width:300px;
background:#111;
color:#fff;
padding:15px;
border-radius:12px;
display:none;
z-index:9999;
}

.minicart-item{
font-size:13px;
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.minicart button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
background:#FFD700;
cursor:pointer;
font-weight:bold;
}

</style>
</head>

<body>

<div class="navbar">

<div class="logo">MysteryStreetwear</div>

<div class="nav-right">

<div class="cart" onclick="toggleCart()">
🛒 <span id="cartCount">0</span>
</div>

<div class="menu" onclick="toggleMenu()">☰</div>

</div>
</div>

<div class="sidebar" id="sidebar">
<a href="product.html">Basic Box</a>
<a href="product.html">Premium Box</a>
<a href="product.html">Luxury Box</a>
<a href="checkout.html">Kurv</a>
</div>

<div class="hero">
<div>
<h1>MYSTERY STREETWEAR</h1>
</div>
</div>

<div class="steps">
<div class="step"><span>1</span><h3>Vælg mysterybox</h3></div>
<div class="step"><span>2</span><h3>Vi pakker</h3></div>
<div class="step"><span>3</span><h3>Unbox din boxe</h3></div>
</div>

<!-- 🧺 MINI CART -->
<div class="minicart" id="minicart">
<div id="miniItems"></div>
<button onclick="goCart()">Gå til kurv</button>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active");
}

/* 🧺 MINI CART TOGGLE */
function toggleCart(){
let box = document.getElementById("minicart");

if(box.style.display === "block"){
box.style.display = "none";
} else {
box.style.display = "block";
updateUI();
}
}

function goCart(){
window.location.href="checkout.html";
}

/* 🧺 ZALANDO STYLE CART RENDER */
function updateUI(){

cart = JSON.parse(localStorage.getItem("cart")) || [];

document.getElementById("cartCount").innerText = cart.length;

let mini = document.getElementById("miniItems");
mini.innerHTML = "";

cart.slice(-5).forEach(item=>{
let div = document.createElement("div");
div.className = "minicart-item";

div.innerText =
item.name +
(item.top ? " | " + item.top : "") +
(item.bottom ? " / " + item.bottom : "");

mini.appendChild(div);
});

}

/* INIT */
updateUI();

</script>

</body>
</html>
