<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>MysteryStreetwear</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
}

/* TOP BAR */
.nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 30px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:white;
}

.logo {
  font-weight:bold;
  font-size:18px;
}

/* MENU */
.menu {
  position:relative;
}

.menu-btn {
  cursor:pointer;
  font-weight:bold;
}

/* DROPDOWN */
.dropdown {
  position:absolute;
  right:0;
  top:40px;
  width:240px;
  background:white;
  border:1px solid #eee;
  border-radius:12px;
  overflow:hidden;
  display:none;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.dropdown.active {
  display:block;
  animation:fade 0.2s ease;
}

@keyframes fade {
  from {opacity:0; transform:translateY(-5px);}
  to {opacity:1; transform:translateY(0);}
}

.item {
  padding:12px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  transition:0.2s;
}

.item:hover {
  background:#FFD700;
}

/* EMPTY CENTER (INTET INDHOLD) */
.hero {
  height:80vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#999;
}

.hero h1 {
  font-weight:normal;
  font-size:18px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="logo">MysteryStreetwear</div>

  <div class="menu">
    <div class="menu-btn" onclick="toggleMenu()">Menu ▾</div>

    <div class="dropdown" id="dropdown">
      <div class="item" onclick="go('basic')">Basic Box - 299 kr</div>
      <div class="item" onclick="go('premium')">Premium Box - 499 kr</div>
      <div class="item" onclick="go('luxury')">Luxury Box - 799 kr</div>
      <div class="item" onclick="window.location.href='cart.html'">Cart</div>
    </div>
  </div>
</div>

<!-- TOM CENTER -->
<div class="hero">
  <h1>Vælg en box i menuen oppe i højre hjørne</h1>
</div>

<script>
function go(id){
  window.location.href = "product.html?id=" + id;
}

function toggleMenu(){
  document.getElementById("dropdown").classList.toggle("active");
}

// luk menu hvis klik udenfor
document.addEventListener("click", function(e){
  if(!document.querySelector(".menu").contains(e.target)){
    document.getElementById("dropdown").classList.remove("active");
  }
});
</script>

</body>
</html>
