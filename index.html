<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>MysteryStreetwear</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
}

/* TOP BAR */
.nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  border-bottom:1px solid #eee;
}

.logo {
  font-weight:bold;
  font-size:20px;
  letter-spacing:1px;
}

.cart {
  cursor:pointer;
  font-weight:bold;
}

/* HERO */
.hero {
  text-align:center;
  padding:80px 20px;
}

.hero h1 {
  font-size:42px;
  margin:0;
}

.hero p {
  color:#666;
}

/* PRODUCTS */
.container {
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  padding:40px;
}

.card {
  width:260px;
  border:1px solid #eee;
  border-radius:14px;
  overflow:hidden;
  transition:0.25s;
  background:#fff;
}

.card:hover {
  transform:translateY(-6px);
  box-shadow:0 15px 30px rgba(0,0,0,0.08);
}

.card img {
  width:100%;
  height:180px;
  object-fit:cover;
}

.content {
  padding:15px;
}

.price {
  color:#111;
  font-weight:bold;
  margin-top:5px;
}

.btn {
  display:block;
  margin-top:10px;
  padding:10px;
  background:#FFD700;
  color:#111;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="nav">
  <div class="logo">MysteryStreetwear</div>
  <div class="cart" onclick="goCart()">Cart</div>
</div>

<div class="hero">
  <h1>Streetwear Mystery Boxes</h1>
  <p>Eksklusive outfits leveret som overraskelse</p>
</div>

<div class="container">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
    <div class="content">
      <h3>Basic Box</h3>
      <div class="price">299 kr</div>
      <div class="btn" onclick="add('basic')">Tilføj til kurv</div>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1520975682031-a6c3b3f4f5d8">
    <div class="content">
      <h3>Premium Box</h3>
      <div class="price">499 kr</div>
      <div class="btn" onclick="add('premium')">Tilføj til kurv</div>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1520975869018-5a6a0d2b5d1c">
    <div class="content">
      <h3>Luxury Box</h3>
      <div class="price">799 kr</div>
      <div class="btn" onclick="add('luxury')">Tilføj til kurv</div>
    </div>
  </div>

</div>

<script>
function add(type){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push(type);
  localStorage.setItem("cart", JSON.stringify(cart));
  window.location.href = "cart.html";
}

function goCart(){
  window.location.href = "cart.html";
}
</script>

</body>
</html>
