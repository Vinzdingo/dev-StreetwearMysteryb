<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MysteryStreetwear</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{background:#fff;color:#111;overflow-x:hidden;}

/* NAVBAR */
.navbar{
height:80px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
border-bottom:1px solid #eee;
position:fixed;
top:0;
width:100%;
background:#fff;
z-index:1000;
}

.logo{font-size:22px;font-weight:bold;}

.nav-right{display:flex;align-items:center;gap:15px;}

/* CART */
.cart{
position:relative;
font-size:22px;
cursor:pointer;
}

.cart span{
position:absolute;
top:-8px;
right:-10px;
background:#FFD700;
color:#000;
font-size:11px;
width:18px;
height:18px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
}

/* MENU */
.menu-btn{font-size:28px;cursor:pointer;}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
right:-320px;
width:300px;
height:100%;
background:#fff;
box-shadow:-10px 0 30px rgba(0,0,0,0.08);
transition:.3s;
padding-top:100px;
z-index:2000;
}

.sidebar.active{right:0;}

.sidebar a{
display:block;
padding:18px;
text-decoration:none;
color:#111;
border-bottom:1px solid #eee;
}

.sidebar a:hover{background:#FFD700;}

/* HERO */
.hero{
margin-top:80px;
height:80vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.95)),
url('https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
}

.hero h1{font-size:60px;}
.hero p{color:#666;margin-top:10px;}

/* INFO */
.info{
max-width:900px;
margin:100px auto;
text-align:center;
padding:0 20px;
}

/* MINI CART */
.minicart{
position:fixed;
top:80px;
right:20px;
width:280px;
background:#fff;
border:1px solid #eee;
border-radius:10px;
padding:15px;
display:none;
z-index:9999;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.minicart.active{display:block;}

.minicart-item{
font-size:14px;
color:#555;
margin-bottom:6px;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

<div class="logo">MysteryStreetwear</div>

<div class="nav-right">

<div class="cart" onclick="toggleCart()">
🛒
<span id="cartCount">0</span>
</div>

<div class="menu-btn" onclick="toggleMenu()">☰</div>

</div>

</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
<a href="product.html?id=basic">Basic Box</a>
<a href="product.html?id=premium">Premium Box</a>
<a href="product.html?id=luxury">Luxury Box</a>
<a href="cart.html">Kurv</a>
</div>

<!-- MINI CART -->
<div class="minicart" id="minicart">
<h4>Din kurv</h4>
<div id="miniItems"></div>
</div>

<!-- HERO -->
<section class="hero">
<div>
<h1>MYSTERY STREETWEAR</h1>
<p>Premium streetwear boxes</p>
</div>
</section>

<!-- INFO -->
<section class="info">
<h2>Sådan fungerer det</h2>
<p>Vælg en box i menuen → tilføj til kurv → checkout</p>
</section>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

/* MENU */
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active");
}

/* CART */
function toggleCart(){
document.getElementById("minicart").classList.toggle("active");
updateCart();
}

/* UPDATE */
function updateCart(){
document.getElementById("cartCount").innerText = cart.length;

let list = document.getElementById("miniItems");
list.innerHTML = "";

cart.slice(-5).forEach(item=>{
let div = document.createElement("div");
div.className="minicart-item";
div.innerText = typeof item === "string" ? item : item.name;
list.appendChild(div);
});
}

/* CLOSE OUTSIDE */
document.addEventListener("click", function(e){
const sidebar = document.getElementById("sidebar");
const menuBtn = document.querySelector(".menu-btn");
const cartBox = document.getElementById("minicart");
const cartIcon = document.querySelector(".cart");

if(sidebar && !sidebar.contains(e.target) && !menuBtn.contains(e.target)){
sidebar.classList.remove("active");
}

if(cartBox && !cartIcon.contains(e.target)){
cartBox.classList.remove("active");
}
});

updateCart();

</script>

</body>
</html>
