<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MysteryStreetwear</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
background:#fff;
color:#111;
overflow-x:hidden;
}

/* TOPBAR */
.topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:70px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 25px;
background:#fff;
border-bottom:1px solid #eee;
z-index:9999;
}

.logo{
font-weight:bold;
font-size:18px;
letter-spacing:1px;
}

.icons{
display:flex;
gap:15px;
align-items:center;
cursor:pointer;
}

/* CART ICON */
.cart{
position:relative;
}

.cart span{
position:absolute;
top:-8px;
right:-10px;
background:#FFD700;
color:#000;
font-size:12px;
width:18px;
height:18px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
}

/* MENU BUTTON */
.menu-btn{
font-size:22px;
cursor:pointer;
}

/* SIDE MENU */
.sidemenu{
position:fixed;
top:0;
left:-300px;
width:280px;
height:100%;
background:#111;
color:#fff;
padding:25px;
transition:.3s;
z-index:10000;
}

.sidemenu.active{
left:0;
}

.sidemenu h3{
margin-bottom:20px;
}

.sidemenu a{
display:block;
color:#fff;
text-decoration:none;
margin-bottom:15px;
opacity:.8;
}

.sidemenu a:hover{
opacity:1;
}

/* HERO */
.hero{
margin-top:90px;
padding:60px 25px;
text-align:center;
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.hero p{
color:#666;
}

/* PRODUCTS */
.grid{
max-width:1100px;
margin:40px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:0 20px;
}

.card{
border:1px solid #eee;
border-radius:14px;
overflow:hidden;
cursor:pointer;
transition:.3s;
background:#fff;
}

.card:hover{
transform:translateY(-6px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card .info{
padding:15px;
}

.card h3{
margin-bottom:5px;
}

.card p{
color:#666;
}

/* ANIMATION */
.fade{
animation:fade .5s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

</style>
</head>

<body>

<!-- SIDEMENU -->
<div class="sidemenu" id="menu">
<h3>MysteryStreetwear</h3>
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">New drops</a>
<a href="#">About</a>
</div>

<!-- TOPBAR -->
<div class="topbar">

<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div class="logo">MysteryStreetwear</div>

<div class="icons">
<div class="cart" onclick="goCart()">
🛒
<span id="cartCount">0</span>
</div>
</div>

</div>

<!-- HERO -->
<div class="hero fade">
<h1>Streetwear Mystery Boxes</h1>
<p>Premium outfits. Handpicked. Delivered fast.</p>
</div>

<!-- PRODUCTS -->
<div class="grid">

<div class="card fade" onclick="openProduct('basic')">
<img src="https://telecaixa.com/cdn/shop/files/1078.jpg?v=1711978877">
<div class="info">
<h3>Basic Box</h3>
<p>299 kr</p>
</div>
</div>

<div class="card fade" onclick="openProduct('premium')">
<img src="https://images.unsplash.com/photo-1521334884684-d80222895322?auto=format&fit=crop&w=900&q=80">
<div class="info">
<h3>Premium Box</h3>
<p>499 kr</p>
</div>
</div>

<div class="card fade" onclick="openProduct('luxury')">
<img src="https://images.unsplash.com/photo-1520975916090-3105956dac38?auto=format&fit=crop&w=900&q=80">
<div class="info">
<h3>Luxury Box</h3>
<p>799 kr</p>
</div>
</div>

</div>

<script>

/* MENU */
function toggleMenu(){
document.getElementById("menu").classList.toggle("active");
}

/* NAV TO PRODUCT */
function openProduct(id){
window.location.href = "product.html?id=" + id;
}

/* CART COUNT */
function updateCart(){
let cart = JSON.parse(localStorage.getItem("cart")) || [];
document.getElementById("cartCount").innerText = cart.length;
}

function goCart(){
window.location.href = "cart.html";
}

updateCart();

</script>

</body>
</html>
