<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>MysteryStreetwear</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
}

/* TOP BAR */
.nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 30px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:white;
}

.logo {
  font-weight:bold;
  font-size:18px;
}

/* MENU */
.menu {
  position:relative;
}

.menu-btn {
  cursor:pointer;
  font-weight:bold;
}

/* DROPDOWN */
.dropdown {
  position:absolute;
  right:0;
  top:40px;
  width:260px;
  background:white;
  border:1px solid #eee;
  border-radius:12px;
  overflow:hidden;
  display:none;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.dropdown.active {
  display:block;
  animation:fade 0.2s ease;
}

@keyframes fade {
  from {opacity:0; transform:translateY(-5px);}
  to {opacity:1; transform:translateY(0);}
}

.item {
  padding:12px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  transition:0.2s;
}

.item:hover {
  background:#FFD700;
}

/* HERO (IKKE KLIKBARE BOXES) */
.hero {
  text-align:center;
  padding:70px 20px;
}

.hero h1 {
  font-size:42px;
  margin:0;
}

.hero p {
  color:#777;
  margin-top:10px;
}

/* VISUELT BANNER (IKKE KLIK) */
.banner {
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  padding:20px;
}

.preview {
  width:260px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #eee;
  opacity:0.9;
}

.preview img {
  width:100%;
  height:170px;
  object-fit:cover;
}

.preview p {
  padding:10px;
  margin:0;
  font-size:14px;
  color:#777;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="logo">MysteryStreetwear</div>

  <div class="menu">
    <div class="menu-btn" onclick="toggleMenu()">Browse Boxes ▾</div>

    <div class="dropdown" id="dropdown">
      <div class="item" onclick="go('basic')">Basic Box - 299 kr</div>
      <div class="item" onclick="go('premium')">Premium Box - 499 kr</div>
      <div class="item" onclick="go('luxury')">Luxury Box - 799 kr</div>
    </div>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h1>Streetwear Mystery Boxes</h1>
  <p>Vælg din box i menuen oppe i højre hjørne</p>
</div>

<!-- DECOR (IKKE KLIKBARE) -->
<div class="banner">

  <div class="preview">
    <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
    <p>Basic Box</p>
  </div>

  <div class="preview">
    <img src="https://images.unsplash.com/photo-1520975682031-a6c3b3f4f5d8">
    <p>Premium Box</p>
  </div>

  <div class="preview">
    <img src="https://images.unsplash.com/photo-1520975869018-5a6a0d2b5d1c">
    <p>Luxury Box</p>
  </div>

</div>

<script>
function go(id){
  window.location.href = "product.html?id=" + id;
}

function toggleMenu(){
  document.getElementById("dropdown").classList.toggle("active");
}

// luk hvis klik udenfor
document.addEventListener("click", function(e){
  if(!document.querySelector(".menu").contains(e.target)){
    document.getElementById("dropdown").classList.remove("active");
  }
});
</script>

</body>
</html>
