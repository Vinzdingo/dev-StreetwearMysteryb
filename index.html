<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>MysteryStreetwear</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
}

/* TOP BAR */
.nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 30px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:white;
}

.logo {
  font-weight:bold;
}

.nav a {
  text-decoration:none;
  color:#111;
  font-weight:bold;
}

/* HERO */
.hero {
  text-align:center;
  padding:60px 20px;
}

.hero h1 {
  margin:0;
  font-size:40px;
}

/* PRODUCTS */
.container {
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
  padding:30px;
}

.card {
  width:250px;
  border:1px solid #eee;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:0.25s;
  animation:fade 0.4s ease;
}

@keyframes fade {
  from {opacity:0; transform:translateY(15px);}
  to {opacity:1; transform:translateY(0);}
}

.card:hover {
  transform:translateY(-6px);
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.card img {
  width:100%;
  height:170px;
  object-fit:cover;
}

.content {
  padding:12px;
}

.btn {
  display:block;
  margin-top:10px;
  padding:10px;
  background:#FFD700;
  font-weight:bold;
  text-align:center;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="nav">
  <div class="logo">MysteryStreetwear</div>
  <a href="cart.html">Cart</a>
</div>

<div class="hero">
  <h1>Streetwear Mystery Boxes</h1>
</div>

<div class="container">

  <div class="card" onclick="go('basic')">
    <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
    <div class="content">
      <h3>Basic Box</h3>
      <div class="btn">View</div>
    </div>
  </div>

  <div class="card" onclick="go('premium')">
    <img src="https://images.unsplash.com/photo-1520975682031-a6c3b3f4f5d8">
    <div class="content">
      <h3>Premium Box</h3>
      <div class="btn">View</div>
    </div>
  </div>

  <div class="card" onclick="go('luxury')">
    <img src="https://images.unsplash.com/photo-1520975869018-5a6a0d2b5d1c">
    <div class="content">
      <h3>Luxury Box</h3>
      <div class="btn">View</div>
    </div>
  </div>

</div>

<script>
function go(id){
  window.location.href = "product.html?id=" + id;
}
</script>

</body>
</html>
