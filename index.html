<!DOCTYPE html>

<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MysteryStreetwear</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
  overflow-x:hidden;
}

.navbar{
  height:80px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 40px;
  border-bottom:1px solid #eee;
  position:fixed;
  width:100%;
  top:0;
  background:#fff;
  z-index:1000;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.menu-btn{
  font-size:30px;
  cursor:pointer;
}

.sidebar{
  position:fixed;
  top:0;
  right:-320px;
  width:320px;
  height:100%;
  background:#fff;
  box-shadow:-5px 0 20px rgba(0,0,0,.1);
  transition:.35s;
  z-index:2000;
  padding-top:100px;
}

.sidebar.active{
  right:0;
}

.sidebar a{
  display:block;
  padding:20px 30px;
  color:#111;
  text-decoration:none;
  font-size:18px;
  border-bottom:1px solid #eee;
}

.sidebar a:hover{
  background:#FFD700;
}

.hero{
  margin-top:80px;
  height:90vh;
  background:
  linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.45)),
  url('https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=1600&q=80');
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero-content{
  animation:fadeUp 1s ease;
}

.hero h1{
  font-size:70px;
  margin-bottom:20px;
}

.hero p{
  font-size:22px;
  margin-bottom:30px;
}

.btn{
  display:inline-block;
  background:#FFD700;
  color:#111;
  padding:15px 30px;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>

</head>

<body>

<div class="navbar">
  <div class="logo">MysteryStreetwear</div>

  <div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="sidebar" id="sidebar">

<a href="product.html?id=basic">Basic Box</a>

<a href="product.html?id=premium">Premium Box</a>

<a href="product.html?id=luxury">Luxury Box</a>

<a href="cart.html">Kurv</a>

<a href="faq.html">FAQ</a>

</div>

<section class="hero">

  <div class="hero-content">

```
<h1>STREETWEAR<br>MYSTERY BOXES</h1>

<p>Eksklusive mystery boxes med håndplukkede streetwear items.</p>

<a href="product.html?id=basic" class="btn">Udforsk</a>
```

  </div>

</section>

<script>
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("active");
}
</script>

</body>
</html>
