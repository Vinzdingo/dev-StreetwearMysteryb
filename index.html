<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>MysteryStreetwear</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
}

.nav {
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  border-bottom:1px solid #eee;
}

.container {
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
  padding:40px;
}

.card {
  width:240px;
  border:1px solid #eee;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:0.2s;
}

.card:hover {
  transform:translateY(-5px);
}

.card img {
  width:100%;
  height:160px;
  object-fit:cover;
}

.btn {
  background:#FFD700;
  padding:10px;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="nav">
  <div><b>MysteryStreetwear</b></div>
</div>

<div class="container">

  <div class="card" onclick="go('basic')">
    <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
    <div class="btn">Basic Box - 299</div>
  </div>

  <div class="card" onclick="go('premium')">
    <img src="https://images.unsplash.com/photo-1520975682031-a6c3b3f4f5d8">
    <div class="btn">Premium Box - 499</div>
  </div>

  <div class="card" onclick="go('luxury')">
    <img src="https://images.unsplash.com/photo-1520975869018-5a6a0d2b5d1c">
    <div class="btn">Luxury Box - 799</div>
  </div>

</div>

<script>
function go(id){
  window.location.href = "product.html?id=" + id;
}
</script>

</body>
</html>
