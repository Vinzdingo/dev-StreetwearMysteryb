<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystery Boxes</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      text-align: center;
    }

    h1 {
      padding: 40px 20px;
    }

    .box {
      background: #1a1a1a;
      margin: 20px auto;
      padding: 20px;
      max-width: 400px;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h1>Mystery Boxes 🎁</h1>

  <div class="box">
    <h2>Basic Box</h2>
    <p>3 items - 299 kr</p>
    <a class="btn" href="cart.html?box=basic">Køb</a>
  </div>

  <div class="box">
    <h2>Premium Box</h2>
    <p>5 items - 499 kr</p>
    <a class="btn" href="cart.html?box=premium">Køb</a>
  </div>

  <div class="box">
    <h2>Luxury Box</h2>
    <p>7 items - 799 kr</p>
    <a class="btn" href="cart.html?box=luxury">Køb</a>
  </div>

</body>
</html>
