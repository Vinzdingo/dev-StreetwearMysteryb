<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:#fff;color:#111;}

/* BACK */
.back{
position:fixed;
top:20px;
left:20px;
padding:10px 14px;
border:1px solid #eee;
border-radius:10px;
cursor:pointer;
background:#fff;
}

/* LAYOUT */
.container{
max-width:1100px;
margin:120px auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
padding:20px;
}

img{width:100%;border-radius:14px;border:1px solid #eee;}

h1{font-size:34px;margin-bottom:10px;}

/* SIZE */
.size{
display:inline-block;
padding:10px 14px;
border:1px solid #ddd;
border-radius:8px;
margin:5px;
cursor:pointer;
}
.size.active{background:#111;color:#fff;}

/* GUIDE */
.guide{border:1px solid #eee;border-radius:12px;margin-top:15px;}
.guide-title{padding:12px;background:#fafafa;cursor:pointer;font-weight:bold;}
.guide-content{display:none;padding:12px;}

/* BUTTON */
button{
width:100%;
padding:14px;
background:#111;
color:#fff;
border:none;
border-radius:10px;
margin-top:20px;
cursor:pointer;
}

/* POPUP */
.popup{
position:fixed;
bottom:20px;
right:20px;
width:260px;
background:#111;
color:#fff;
padding:15px;
border-radius:12px;
display:none;
}

.popup button{
width:100%;
margin-top:10px;
border:none;
border-radius:8px;
padding:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="back" onclick="history.back()">← Menu</div>

<div class="container">

<img src="https://telecaixa.com/cdn/shop/files/1078.jpg?v=1711978877">

<div>

<h1>Mystery Box</h1>

<h3>Trøje</h3>
<div>
<div class="size" onclick="select(this,'top')">S</div>
<div class="size" onclick="select(this,'top')">M</div>
<div class="size" onclick="select(this,'top')">L</div>
</div>

<h3>Bukse</h3>
<div>
<div class="size" onclick="select(this,'bottom')">28</div>
<div class="size" onclick="select(this,'bottom')">30</div>
<div class="size" onclick="select(this,'bottom')">32</div>
</div>

<!-- GUIDE -->
<div class="guide">
<div class="guide-title" onclick="toggleGuide(this)">
Størrelsesguide
</div>

<div class="guide-content">
Trøjer + Bukser size info her
</div>
</div>

<button onclick="addToCart()">Tilføj til kurv</button>

</div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">

<p>Tilføjet ✔</p>

<button onclick="continueShop()">Shop videre</button>
<button onclick="goCart()">Kurv</button>

</div>

<script>

let topSize = null;
let bottomSize = null;

/* SIZE */
function select(el,type){
document.querySelectorAll(".size").forEach(e=>e.classList.remove("active"));
el.classList.add("active");

if(type==="top") topSize = el.innerText;
if(type==="bottom") bottomSize = el.innerText;
}

/* GUIDE FIX */
function toggleGuide(el){
let content = el.nextElementSibling;
content.style.display = content.style.display === "block" ? "none" : "block";
}

/* CART */
function addToCart(){

if(!topSize || !bottomSize){
alert("Vælg størrelser");
return;
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name:"Mystery Box",
price:299,
top:topSize,
bottom:bottomSize,
qty:1
});

localStorage.setItem("cart", JSON.stringify(cart));

document.getElementById("popup").style.display = "block";
}

/* POPUP ACTIONS */
function continueShop(){
document.getElementById("popup").style.display = "none";
}

function goCart(){
window.location.href = "checkout.html";
}

</script>

</body>
</html>
