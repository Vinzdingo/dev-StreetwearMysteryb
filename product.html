<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product</title>

<style>
body{font-family:Arial;padding:20px;}
.back{position:fixed;top:20px;left:20px;cursor:pointer;}

.sizes{display:flex;gap:10px;margin:10px 0;}
.size{padding:10px;border:1px solid #ddd;cursor:pointer;}
.size.active{background:#000;color:#fff;}

button{margin-top:20px;padding:12px;width:100%;}
</style>
</head>

<body>

<div class="back" onclick="history.back()">← Tilbage</div>

<h1>Mystery Box</h1>

<h3>Trøje størrelse</h3>
<div class="sizes" id="top">
<div class="size" onclick="select(this,'top')">S</div>
<div class="size" onclick="select(this,'top')">M</div>
<div class="size" onclick="select(this,'top')">L</div>
</div>

<h3>Bukse størrelse</h3>
<div class="sizes" id="bottom">
<div class="size" onclick="select(this,'bottom')">28</div>
<div class="size" onclick="select(this,'bottom')">30</div>
<div class="size" onclick="select(this,'bottom')">32</div>
</div>

<button onclick="add()">Tilføj til kurv</button>

<script>

let topSize=null;
let bottomSize=null;

function select(el,type){
document.querySelectorAll("#"+type+" .size").forEach(e=>e.classList.remove("active"));
el.classList.add("active");

if(type==="top") topSize=el.innerText;
if(type==="bottom") bottomSize=el.innerText;
}

function add(){

if(!topSize || !bottomSize){
alert("Vælg størrelser");
return;
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name:"Mystery Box",
top:topSize,
bottom:bottomSize
});

localStorage.setItem("cart",JSON.stringify(cart));

alert("Tilføjet til kurv");
}

</script>

</body>
</html>
