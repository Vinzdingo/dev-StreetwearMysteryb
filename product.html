<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MysteryStreetwear</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:#fff;
color:#111;
}

.back{
position:fixed;
top:20px;
left:20px;
font-weight:bold;
cursor:pointer;
z-index:9999;
}

.container{
max-width:1200px;
margin:120px auto;
display:flex;
gap:80px;
padding:0 40px;
}

/* LEFT */
.left{flex:1;}

.main-img{
width:100%;
border-radius:12px;
border:1px solid #eee;
object-fit:cover;
}

.thumbs{
display:flex;
gap:10px;
margin-top:10px;
}

.thumbs img{
width:80px;
height:80px;
border-radius:8px;
cursor:pointer;
border:1px solid #eee;
object-fit:cover;
transition:.2s;
}

.thumbs img:hover{
transform:scale(1.05);
}

/* RIGHT */
.right{flex:1;}

.title{
font-size:40px;
margin-bottom:10px;
}

.price{
font-size:24px;
margin-bottom:15px;
}

.desc{
color:#666;
margin-bottom:25px;
line-height:1.6;
}

.btn{
display:inline-block;
background:#FFD700;
padding:14px 22px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

/* SIZE */
.size-group{
margin-top:20px;
}

.size-title{
font-weight:bold;
margin-bottom:10px;
}

.sizes{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.size{
padding:10px 14px;
border:1px solid #ddd;
border-radius:8px;
cursor:pointer;
}

.size.active{
background:#FFD700;
border-color:#FFD700;
}

</style>
</head>

<body>

<div class="back" onclick="history.back()">← Tilbage</div>

<div class="container">

<!-- LEFT -->
<div class="left">

<img id="mainImg" class="main-img">

<div class="thumbs">

<img onclick="changeImg(this)"
src="https://telecaixa.com/cdn/shop/files/1078.jpg?v=1711978877">

<img onclick="changeImg(this)"
src="https://images.unsplash.com/photo-1607082349566-187342175e2f?auto=format&fit=crop&w=300&q=80">

<img onclick="changeImg(this)"
src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=300&q=80">

</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="title" id="title">Mystery Box</div>
<div class="price" id="price"></div>

<div class="desc">
MysteryStreetwear box med håndplukkede items. Hver box er unik.
</div>

<div class="btn" onclick="addToCart()">
Tilføj til kurv
</div>

<!-- TRØJER -->
<div class="size-group">
<div class="size-title">Trøjer</div>
<div class="sizes">
<div class="size" onclick="selectSize(this)">S</div>
<div class="size" onclick="selectSize(this)">M</div>
<div class="size" onclick="selectSize(this)">L</div>
<div class="size" onclick="selectSize(this)">XL</div>
</div>
</div>

<!-- BUKSER -->
<div class="size-group">
<div class="size-title">Bukser</div>
<div class="sizes">
<div class="size" onclick="selectSize(this)">28</div>
<div class="size" onclick="selectSize(this)">30</div>
<div class="size" onclick="selectSize(this)">32</div>
<div class="size" onclick="selectSize(this)">34</div>
</div>
</div>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const products = {
basic:{
name:"Basic Box",
price:299,
img:"https://telecaixa.com/cdn/shop/files/1078.jpg?v=1711978877"
},
premium:{
name:"Premium Box",
price:499,
img:"https://images.unsplash.com/photo-1521334884684-d80222895322?auto=format&fit=crop&w=900&q=80"
},
luxury:{
name:"Luxury Box",
price:799,
img:"https://images.unsplash.com/photo-1520975916090-3105956dac38?auto=format&fit=crop&w=900&q=80"
}
};

const product = products[id] || products.basic;

document.getElementById("title").innerText = product.name;
document.getElementById("price").innerText = product.price + " kr";
document.getElementById("mainImg").src = product.img;

function changeImg(el){
document.getElementById("mainImg").src = el.src;
}

let selectedSize = "";

function selectSize(el){
document.querySelectorAll(".size").forEach(s=>s.classList.remove("active"));
el.classList.add("active");
selectedSize = el.innerText;
}

function addToCart(){

if(!selectedSize){
alert("Vælg størrelse");
return;
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
id:id,
name:product.name,
price:product.price,
size:selectedSize,
img:product.img
});

localStorage.setItem("cart", JSON.stringify(cart));

alert("Tilføjet til kurv ✔");
}

</script>

</body>
</html>
