<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:#fff;
color:#111;
}

.nav{
height:80px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 40px;
border-bottom:1px solid #eee;
}

.logo{
font-weight:bold;
font-size:22px;
}

.container{
max-width:1200px;
margin:120px auto;
display:flex;
gap:60px;
padding:0 40px;
}

.left{flex:1;}

.main-img{
width:100%;
border-radius:12px;
border:1px solid #eee;
}

.thumbs{
display:flex;
gap:10px;
margin-top:10px;
}

.thumbs img{
width:80px;
height:80px;
object-fit:cover;
border-radius:8px;
cursor:pointer;
border:1px solid #eee;
transition:.2s;
}

.thumbs img:hover{
transform:scale(1.05);
}

.right{flex:1;}

.title{
font-size:36px;
margin-bottom:10px;
}

.price{
font-size:24px;
margin-bottom:20px;
}

.desc{
color:#666;
line-height:1.6;
margin-bottom:30px;
}

.sizes{
display:flex;
gap:10px;
margin-bottom:25px;
}

.size{
padding:12px 16px;
border:1px solid #ddd;
cursor:pointer;
border-radius:8px;
transition:.2s;
}

.size:hover{
border-color:#FFD700;
}

.size.active{
background:#FFD700;
border-color:#FFD700;
}

.btn{
display:inline-block;
background:#FFD700;
padding:15px 25px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
}

.acc{
margin-top:40px;
border-top:1px solid #eee;
}

.acc-item{
border-bottom:1px solid #eee;
padding:20px 0;
cursor:pointer;
}

.acc-title{
font-weight:bold;
display:flex;
justify-content:space-between;
}

.acc-content{
display:none;
margin-top:10px;
color:#666;
line-height:1.6;
}

.acc-item.active .acc-content{
display:block;
}
</style>
</head>

<body>

<div class="nav">
<div class="logo">MysteryStreetwear</div>
</div>

<div class="container">

<div class="left">

<img id="mainImg" class="main-img"
src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80">

<div class="thumbs">

<img onclick="changeImg(this)" src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=200&q=80">
<img onclick="changeImg(this)" src="https://images.unsplash.com/photo-1521334884684-d80222895322?auto=format&fit=crop&w=200&q=80">
<img onclick="changeImg(this)" src="https://images.unsplash.com/photo-1520975916090-3105956dac38?auto=format&fit=crop&w=200&q=80">

</div>

</div>

<div class="right">

<div class="title" id="title">Basic Box</div>
<div class="price">299 kr</div>

<div class="desc">
En mystery box fyldt med streetwear items.
</div>

<div class="sizes">

<div class="size" onclick="selectSize(this)">S</div>
<div class="size" onclick="selectSize(this)">M</div>
<div class="size" onclick="selectSize(this)">L</div>
<div class="size" onclick="selectSize(this)">XL</div>

</div>

<div class="btn" onclick="addToCart()">
Tilføj til kurv
</div>

<div class="acc">

<div class="acc-item" onclick="toggleAcc(this)">
<div class="acc-title">Størrelsesguide <span>+</span></div>
<div class="acc-content">
Bryst: 90-114 cm<br>
Talje: 74-97 cm
</div>
</div>

<div class="acc-item" onclick="toggleAcc(this)">
<div class="acc-title">Indhold <span>+</span></div>
<div class="acc-content">
Hoodies, T-shirts, Cargos, Accessories
</div>
</div>

<div class="acc-item" onclick="toggleAcc(this)">
<div class="acc-title">Levering <span>+</span></div>
<div class="acc-content">
2-5 dage levering<br>
14 dages retur
</div>
</div>

</div>

</div>

</div>

<script>

let selectedSize = "";

function changeImg(el){
document.getElementById("mainImg").src = el.src;
}

function selectSize(el){
document.querySelectorAll(".size").forEach(s=>s.classList.remove("active"));
el.classList.add("active");
selectedSize = el.innerText;
}

function addToCart(){
if(!selectedSize){
alert("Vælg størrelse først");
return;
}
alert("Tilføjet til kurv: " + selectedSize);
}

function toggleAcc(el){
el.classList.toggle("active");
}

</script>

</body>
</html>
