<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product</title>

<style>
body{font-family:Arial;padding:20px;}

.back{
position:fixed;
top:20px;
left:20px;
padding:10px;
border:1px solid #eee;
cursor:pointer;
background:#fff;
}

.sizes{display:flex;gap:10px;margin:10px 0;}
.size{padding:10px;border:1px solid #ddd;cursor:pointer;}
.size.active{background:#111;color:#fff;}

button{
width:100%;
padding:14px;
background:#111;
color:#fff;
border:none;
margin-top:20px;
}

/* POPUP */
.popup{
position:fixed;
bottom:20px;
right:20px;
width:260px;
background:#111;
color:#fff;
padding:15px;
border-radius:12px;
display:none;
}

.popup button{
width:100%;
margin-top:10px;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
}

.shop{background:#fff;color:#111;}
.cart{background:#FFD700;}
</style>
</head>

<body>

<div class="back" onclick="history.back()">← Tilbage</div>

<h1 id="title">Mystery Box</h1>

<h3>Trøje</h3>
<div class="sizes" id="top">
<div class="size" onclick="select(this,'top')">S</div>
<div class="size" onclick="select(this,'top')">M</div>
<div class="size" onclick="select(this,'top')">L</div>
</div>

<h3>Bukser</h3>
<div class="sizes" id="bottom">
<div class="size" onclick="select(this,'bottom')">28</div>
<div class="size" onclick="select(this,'bottom')">30</div>
<div class="size" onclick="select(this,'bottom')">32</div>
</div>

<button onclick="addToCart()">Tilføj til kurv</button>

<div class="popup" id="popup">
<p>Tilføjet ✔</p>
<button class="cart" onclick="goCart()">Gå til kurv</button>
<button class="shop" onclick="closePopup()">Shop videre</button>
</div>

<script>

let selectedTop=null;
let selectedBottom=null;

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function select(el,type){

document.querySelectorAll("#"+type+" .size").forEach(e=>e.classList.remove("active"));
el.classList.add("active");

if(type==="top") selectedTop=el.innerText;
if(type==="bottom") selectedBottom=el.innerText;
}

function addToCart(){

if(!selectedTop || !selectedBottom){
alert("Vælg størrelser");
return;
}

cart.push({
name:"Mystery Box",
price:299,
top:selectedTop,
bottom:selectedBottom
});

localStorage.setItem("cart",JSON.stringify(cart));

document.getElementById("popup").style.display="block";
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function goCart(){
window.location.href="checkout.html";
}

</script>

</body>
</html>
