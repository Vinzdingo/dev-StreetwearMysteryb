<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#fff;
color:#111;
}

.back{
position:fixed;
top:20px;
left:20px;
padding:10px 14px;
border:1px solid #eee;
border-radius:10px;
cursor:pointer;
background:#fff;
z-index:1000;
}

.container{
max-width:1100px;
margin:120px auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
padding:20px;
}

img{
width:100%;
border-radius:14px;
border:1px solid #eee;
}

h1{
font-size:34px;
margin-bottom:10px;
}

.price{
font-size:20px;
color:#444;
margin:10px 0;
}

.bullets{
color:#555;
line-height:1.7;
margin:15px 0;
}

.sizes{
margin:10px 0 20px;
}

.size{
display:inline-block;
padding:10px 14px;
border:1px solid #ddd;
border-radius:8px;
cursor:pointer;
margin:5px;
}

.size.active{
background:#111;
color:#fff;
}

button{
width:100%;
padding:14px;
background:#111;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:20px;
font-size:16px;
}

/* POPUP */
.popup{
position:fixed;
bottom:20px;
right:20px;
width:260px;
background:#111;
color:#fff;
padding:15px;
border-radius:12px;
display:none;
z-index:9999;
}

.popup button{
width:100%;
margin-top:10px;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
}

.cartBtn{background:#FFD700;color:#111;}
.shop{background:#fff;color:#111;}

</style>

</head>

<body>

<div class="back" onclick="history.back()">← Tilbage</div>

<div class="container">

<img id="img">

<div>

<h1 id="title"></h1>
<div class="price" id="price"></div>

<div class="bullets">
✓ Håndplukkede streetwear items<br>
✓ Vælg dine størrelser<br>
✓ 1-5 dages levering
</div>

<h3>Trøje størrelse</h3>
<div class="sizes" id="topSizes">
<div class="size" onclick="select(this,'top')">S</div>
<div class="size" onclick="select(this,'top')">M</div>
<div class="size" onclick="select(this,'top')">L</div>
<div class="size" onclick="select(this,'top')">XL</div>
</div>

<h3>Bukse størrelse</h3>
<div class="sizes" id="bottomSizes">
<div class="size" onclick="select(this,'bottom')">28</div>
<div class="size" onclick="select(this,'bottom')">30</div>
<div class="size" onclick="select(this,'bottom')">32</div>
<div class="size" onclick="select(this,'bottom')">34</div>
</div>

<button onclick="addToCart()">Tilføj til kurv</button>

</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">

<p>Tilføjet til kurv ✔</p>

<button class="cartBtn" onclick="goCart()">Gå til kurv</button>
<button class="shop" onclick="closePopup()">Shop videre</button>

</div>

<script>

let selectedTop = null;
let selectedBottom = null;

/* PRODUCTS */
const products = {
basic:{
name:"Basic Box",
price:299,
img:"https://telecaixa.com/cdn/shop/files/1078.jpg?v=1711978877"
},
premium:{
name:"Premium Box",
price:499,
img:"https://images.unsplash.com/photo-1521334884684-d80222895322?auto=format&fit=crop&w=900&q=80"
},
luxury:{
name:"Luxury Box",
price:799,
img:"https://images.unsplash.com/photo-1520975916090-3105956dac38?auto=format&fit=crop&w=900&q=80"
}
};

/* GET ID FROM URL */
const params = new URLSearchParams(window.location.search);
let id = params.get("id") || "basic";

let product = products[id];

/* RENDER */
document.getElementById("title").innerText = product.name;
document.getElementById("price").innerText = product.price + " kr";
document.getElementById("img").src = product.img;

/* SIZE SELECT */
function select(el,type){

document.querySelectorAll("#"+type+"Sizes .size")
.forEach(e=>e.classList.remove("active"));

el.classList.add("active");

if(type==="top") selectedTop = el.innerText;
if(type==="bottom") selectedBottom = el.innerText;

}

/* ADD TO CART */
function addToCart(){

if(!selectedTop || !selectedBottom){
alert("Vælg både trøje og bukse størrelse");
return;
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name: product.name,
price: product.price,
top: selectedTop,
bottom: selectedBottom
});

localStorage.setItem("cart", JSON.stringify(cart));

document.getElementById("popup").style.display = "block";
}

/* POPUP */
function closePopup(){
document.getElementById("popup").style.display = "none";
}

function goCart(){
window.location.href="checkout.html";
}

</script>

</body>
</html>
