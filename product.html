<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#fff;
color:#111;
}

/* TOP NAV */
.topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:70px;
background:#fff;
border-bottom:1px solid #eee;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
z-index:1000;
}

.btn{
padding:8px 12px;
border:1px solid #ddd;
border-radius:8px;
cursor:pointer;
background:#fff;
}

/* LAYOUT */
.container{
max-width:1100px;
margin:100px auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
padding:20px;
}

img{
width:100%;
border-radius:14px;
border:1px solid #eee;
}

h1{font-size:32px;margin-bottom:10px;}
.price{margin:10px 0;color:#444;}

/* SIZE */
.size{
display:inline-block;
padding:10px 14px;
border:1px solid #ddd;
border-radius:8px;
margin:5px;
cursor:pointer;
}
.size.active{
background:#111;
color:#fff;
}

/* GUIDE */
.guide{
border:1px solid #eee;
border-radius:12px;
margin-top:15px;
overflow:hidden;
}

.guide-title{
padding:12px;
background:#f5f5f5;
cursor:pointer;
font-weight:bold;
}

.guide-content{
display:none;
padding:12px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border:1px solid #eee;
padding:8px;
font-size:13px;
}

/* BUTTONS */
button{
width:100%;
padding:14px;
background:#111;
color:#fff;
border:none;
border-radius:10px;
margin-top:20px;
cursor:pointer;
}

/* POPUP */
.popup{
position:fixed;
bottom:20px;
right:20px;
background:#111;
color:#fff;
padding:15px;
border-radius:12px;
display:none;
width:260px;
}

.popup button{
width:100%;
margin-top:10px;
border:none;
border-radius:8px;
padding:10px;
cursor:pointer;
}

.yellow{
background:#FFD700;
color:#111;
}

.white{
background:#fff;
color:#111;
}

</style>

</head>

<body>

<!-- TOP BAR -->
<div class="topbar">

<button class="btn" onclick="goHome()">← Menu</button>

<div><b>Mystery Box</b></div>

<button class="btn" onclick="goCart()">🛒</button>

</div>

<div class="container">

<!-- IMAGE -->
<div>
<img src="https://telecaixa.com/cdn/shop/files/1078.jpg?v=1711978877">
</div>

<!-- INFO -->
<div>

<h1>Mystery Box</h1>
<div class="price">299 kr</div>

<h3>Trøje størrelse</h3>
<div>
<div class="size" onclick="select(this,'top')">S</div>
<div class="size" onclick="select(this,'top')">M</div>
<div class="size" onclick="select(this,'top')">L</div>
<div class="size" onclick="select(this,'top')">XL</div>
</div>

<h3>Bukse størrelse</h3>
<div>
<div class="size" onclick="select(this,'bottom')">28</div>
<div class="size" onclick="select(this,'bottom')">30</div>
<div class="size" onclick="select(this,'bottom')">32</div>
<div class="size" onclick="select(this,'bottom')">34</div>
</div>

<!-- GUIDE -->
<div class="guide">
<div class="guide-title" onclick="toggleGuide(this)">
📏 Størrelsesguide
</div>

<div class="guide-content">

<h4>Trøjer</h4>
<table>
<tr><th>Size</th><th>Bryst</th></tr>
<tr><td>S</td><td>86-92</td></tr>
<tr><td>M</td><td>92-98</td></tr>
<tr><td>L</td><td>98-104</td></tr>
<tr><td>XL</td><td>104-110</td></tr>
</table>

<br>

<h4>Bukser</h4>
<table>
<tr><th>Size</th><th>Talje</th></tr>
<tr><td>28</td><td>71-73</td></tr>
<tr><td>30</td><td>76-78</td></tr>
<tr><td>32</td><td>81-83</td></tr>
<tr><td>34</td><td>86-88</td></tr>
</table>

</div>
</div>

<button onclick="addToCart()">Tilføj til kurv</button>

</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">

<p>Tilføjet til kurv ✔</p>

<button class="yellow" onclick="continueShopping()">Shop videre</button>
<button class="white" onclick="goCart()">Gå til kurv</button>

</div>

<script>

let topSize = null;
let bottomSize = null;

/* NAV */
function goHome(){
window.location.href = "index.html";
}

function goCart(){
window.location.href = "checkout.html";
}

/* GUIDE FIX */
function toggleGuide(el){
let content = el.nextElementSibling;
content.style.display =
content.style.display === "block" ? "none" : "block";
}

/* SIZE SELECT */
function select(el,type){

document.querySelectorAll(".size").forEach(e=>e.classList.remove("active"));
el.classList.add("active");

if(type==="top") topSize = el.innerText;
if(type==="bottom") bottomSize = el.innerText;

}

/* CART */
function addToCart(){

if(!topSize || !bottomSize){
alert("Vælg størrelser");
return;
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name:"Mystery Box",
price:299,
top:topSize,
bottom:bottomSize,
qty:1
});

localStorage.setItem("cart", JSON.stringify(cart));

document.getElementById("popup").style.display = "block";
}

/* SHOP VIDERE */
function continueShopping(){
document.getElementById("popup").style.display = "none";
}

</script>

</body>
</html>
