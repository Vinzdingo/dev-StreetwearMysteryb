<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#fff;color:#111;}

.back{position:fixed;top:20px;left:20px;padding:10px 14px;border:1px solid #eee;border-radius:10px;cursor:pointer;background:#fff;}

.container{max-width:1100px;margin:120px auto;display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:20px;}

img{width:100%;border-radius:14px;border:1px solid #eee;}

h1{font-size:34px;margin-bottom:10px;}
.price{font-size:20px;color:#444;margin:10px 0;}
.bullets{color:#555;line-height:1.7;margin:15px 0;}

.sizes{margin:10px 0 20px;}
.size{display:inline-block;padding:10px 14px;border:1px solid #ddd;border-radius:8px;cursor:pointer;margin:5px;}
.size.active{background:#111;color:#fff;}

.guide{border:1px solid #eee;border-radius:12px;margin-top:15px;cursor:pointer;}
.guide-title{padding:12px;background:#fafafa;font-weight:bold;}
.guide-content{display:none;padding:12px;font-size:14px;color:#555;border-top:1px solid #eee;}

button{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:10px;cursor:pointer;margin-top:20px;}

.popup{position:fixed;bottom:20px;right:20px;width:260px;background:#111;color:#fff;padding:15px;border-radius:12px;display:none;}

.cartBtn{background:#FFD700;color:#111;}
.shop{background:#fff;color:#111;}
</style>

</head>

<body>

<div class="back" onclick="history.back()">← Tilbage</div>

<div class="container">

<img>

<div>

<h1 id="title">Mystery Box</h1>
<div class="price">299 kr</div>

<div class="bullets">
✓ Håndplukkede items<br>
✓ Vælg størrelser<br>
✓ Hurtig levering
</div>

<h3>Trøje</h3>
<div class="sizes" id="topSizes">
<div class="size" onclick="select(this,'top')">S</div>
<div class="size" onclick="select(this,'top')">M</div>
<div class="size" onclick="select(this,'top')">L</div>
<div class="size" onclick="select(this,'top')">XL</div>
</div>

<h3>Bukser</h3>
<div class="sizes" id="bottomSizes">
<div class="size" onclick="select(this,'bottom')">28</div>
<div class="size" onclick="select(this,'bottom')">30</div>
<div class="size" onclick="select(this,'bottom')">32</div>
<div class="size" onclick="select(this,'bottom')">34</div>
</div>

<div class="guide" onclick="toggleGuide(this)">
<div class="guide-title">📏 Størrelsesguide</div>
<div class="guide-content">
Tøj størrelser vises her...
</div>
</div>

<button onclick="addToCart()">Tilføj til kurv</button>

</div>
</div>

<div class="popup" id="popup">
<p>Tilføjet ✔</p>
<button class="cartBtn" onclick="goCart()">Kurv</button>
<button class="shop" onclick="closePopup()">Shop</button>
</div>

<script>

let selectedTop = null;
let selectedBottom = null;

function getCart(){
return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveCart(c){
localStorage.setItem("cart", JSON.stringify(c));
}

function select(el,type){
document.querySelectorAll("#"+type+"Sizes .size").forEach(e=>e.classList.remove("active"));
el.classList.add("active");
if(type==="top") selectedTop = el.innerText;
if(type==="bottom") selectedBottom = el.innerText;
}

function toggleGuide(el){
let c = el.querySelector(".guide-content");
c.style.display = c.style.display === "block" ? "none" : "block";
}

function addToCart(){

if(!selectedTop || !selectedBottom){
alert("Vælg størrelser");
return;
}

let cart = getCart();

let item = {
id: Date.now(),
name: "Mystery Box",
price: 299,
top: selectedTop,
bottom: selectedBottom,
qty: 1
};

let ex = cart.find(i => i.top===item.top && i.bottom===item.bottom);

if(ex) ex.qty++;
else cart.push(item);

saveCart(cart);

document.getElementById("popup").style.display="block";
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function goCart(){
window.location.href="cart.html";
}

</script>

</body>
</html>
